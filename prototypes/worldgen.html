/* ========================================================= conditioning ====
   terrain-diffusion does not invent a planet, it resolves one. Its input is
   five rasters and its own inference/utils/azgaar_to_tiff.py spells out
   exactly which, in which units:

     heightmap.tif         elevation, metres, negative below sea
     temperature.tif       mean temperature, C
     temperature_std.tif   temperature standard deviation, C
     precipitation.tif     annual precipitation, mm
     precipitation_cv.tif  precipitation coefficient of variation, percent

   We already simulate elevation, temperature, precipitation and biome, and the
   last two rasters are a biome lookup in that same file. So the bridge is not a
   fork of anything — it is writing down what the generator already knows.

   What this does NOT do is convert units. It ships the raw simulation fields
   and lets tools/cond_to_tiff.py do the physical mapping, because how many
   metres the tallest mountain is and how many millimetres fall on the wettest
   coast are worth re-deciding without regenerating the planet.
========================================================================== */

const COND_MAGIC='SPCOND\u0001\n';

function buildConditioning(){
  if(!world) throw new Error('generate a world first');
  const {el,sea,temp,wet,biome,cfg,tec}=world, N=W*H;
  const names=Object.keys(BIOME);
  const bidx=new Uint8Array(N);
  for(let i=0;i<N;i++){const k=names.indexOf(biome[i]); bidx[i]=k<0?0:k}

  const fields=[
    {name:'elevation', dtype:'f32', note:'0-1, sea level at header.seaLevel'},
    {name:'temperature',dtype:'f32',note:'degrees C, already physical'},
    {name:'precipIndex',dtype:'f32',note:'1.0 = 88th percentile of land precipitation'},
    {name:'biome',     dtype:'u8',  note:'index into header.biomeNames'},
  ];
  const arrays=[el,temp,wet,bidx];
  let off=0;
  for(let k=0;k<fields.length;k++){
    fields[k].offset=off;
    fields[k].bytes=arrays[k].byteLength;
    off+=arrays[k].byteLength;
  }

  const header={
    format:'spacology-conditioning', version:1,
    width:W, height:H,
    seaLevel:sea,
    projection:'equirectangular', lonW:-180, lonE:180, latS:-90, latN:90,
    seed:cfg.seed, plates:tec.count,
    generator:cfg,
    biomeNames:names,
    fields, dataBytes:off,
  };
  const hj=new TextEncoder().encode(JSON.stringify(header));
  const magic=new TextEncoder().encode(COND_MAGIC);
  const buf=new ArrayBuffer(magic.length+4+hj.length+off);
  const u8=new Uint8Array(buf);
  u8.set(magic,0);
  new DataView(buf).setUint32(magic.length,hj.length,true);
  u8.set(hj,magic.length+4);
  let p=magic.length+4+hj.length;
  for(const a of arrays){ u8.set(new Uint8Array(a.buffer,a.byteOffset,a.byteLength),p); p+=a.byteLength }
  return {buffer:buf, header};
}

function exportConditioning(){
  const {buffer,header}=buildConditioning();
  const blob=new Blob([buffer],{type:'application/octet-stream'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`${header.seed}-${W}x${H}.cond`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  const mb=(buffer.byteLength/1048576).toFixed(1);
  document.getElementById('stat').textContent=
    `conditioning written · ${W}x${H} cells · ${mb} MB · ${a.download}`;
}

/* ---- looking around -----------------------------------------------------
   Screen centre is exactly (lat = camera tilt, lon = camera spin), which falls
   out of the transform, so centring on a point is just writing its lat/lon
   into the camera. That is what makes wheel-toward-the-cursor and
   double-click-to-centre one line each instead of a pan offset nobody can
   reason about.
------------------------------------------------------------------------- */
function glPos(e){
  const r=glc.getBoundingClientRect();
  return {x:(e.clientX-r.left)*glc.width/r.width,
          y:(e.clientY-r.top)*glc.height/r.height};
}
function globePick(px,py){
  if(!gcam) return null;
  const {R,cx,cy,spin,cb,sb}=gcam;
  const nx=(px-cx)/R, ny=(cy-py)/R, r2=nx*nx+ny*ny;
  if(r2>1) return null;                      // clicked space, not the planet
  const nz=Math.sqrt(1-r2), cs=Math.cos(spin), sn=Math.sin(spin);
  const ty=ny*cb+nz*sb, tz=-ny*sb+nz*cb;
  const wx=nx*cs+tz*sn, wz=-nx*sn+tz*cs;
  return {lat:Math.asin(clampv(ty,-1,1))*180/Math.PI,
          lon:Math.atan2(wx,wz)*180/Math.PI};
}
function centreOn(hit,f){
  gview.lon=wrapLon(gview.lon+wrapLon(hit.lon-gview.lon)*f);
  gview.lat=clampv(gview.lat+(hit.lat-gview.lat)*f,-85,85);
}

// Draw coarse now, detailed a moment after the hand stops. A wheel gesture is
// a burst of events and each detailed frame is a real cost, so only the last
// one pays it.
let gsettle=0;
function drawSoon(){
  drawGlobe(true);
  clearTimeout(gsettle);
  gsettle=setTimeout(()=>drawGlobe(),140);
}

const gptr=new Map(); let gdrag=null, gpinch=0;
const pinchSpan=()=>{
  const v=[...gptr.values()];
  return v.length<2?0:Math.hypot(v[0].x-v[1].x, v[0].y-v[1].y);
};
glc.style.touchAction='none';
glc.style.cursor='grab';
glc.addEventListener('pointerdown',e=>{
  glc.setPointerCapture(e.pointerId);
  gptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(gptr.size===1){ gdrag={x:e.clientX,y:e.clientY}; glc.style.cursor='grabbing'; }
  else if(gptr.size===2){ gpinch=pinchSpan(); gdrag=null; }
});
glc.addEventListener('pointermove',e=>{
  if(!gptr.has(e.pointerId)) return;
  gptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(gptr.size>=2){
    const d=pinchSpan();
    if(gpinch>0&&d>0) gview.zoom=clampv(gview.zoom*d/gpinch,ZMIN,ZMAX);
    gpinch=d; camToSliders(); drawGlobe(true); return;
  }
  if(!gdrag) return;
  // slower when zoomed in, so the ground keeps up with the finger
  const k=0.32/gview.zoom;
  gview.lon=wrapLon(gview.lon-(e.clientX-gdrag.x)*k);
  gview.lat=clampv(gview.lat+(e.clientY-gdrag.y)*k,-85,85);
  gdrag={x:e.clientX,y:e.clientY};
  camToSliders(); drawGlobe(true);
});
const glEnd=e=>{
  gptr.delete(e.pointerId);
  if(gptr.size<2) gpinch=0;
  if(gptr.size===0){ gdrag=null; glc.style.cursor='grab'; drawSoon(); }
};
glc.addEventListener('pointerup',glEnd);
glc.addEventListener('pointercancel',glEnd);
glc.addEventListener('wheel',e=>{
  e.preventDefault();
  const z0=gview.zoom;
  gview.zoom=clampv(z0*Math.exp(-e.deltaY*0.0018),ZMIN,ZMAX);
  if(gview.zoom>z0){                          // zoom toward what you pointed at
    const p=glPos(e), hit=globePick(p.x,p.y);
    if(hit) centreOn(hit,Math.min(0.55,(gview.zoom-z0)/z0*1.4));
  }
  camToSliders(); drawSoon();
},{passive:false});
glc.addEventListener('dblclick',e=>{
  const p=glPos(e), hit=globePick(p.x,p.y);
  if(hit){ centreOn(hit,1); camToSliders(); drawGlobe() }
});
['cLights','cPorts','cOrbit'].forEach(id=>$(id).onchange=drawGlobe);

applyPreset(Object.keys(PRESETS)[0]);
syncLabels();
run();
