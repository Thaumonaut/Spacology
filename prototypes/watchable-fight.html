<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watchable fight</title>
<style>
:root{
  --bg:#131A21; --panel:#1B242D; --raised:#232F3A; --line:#2E3C48;
  --ink:#DCE4EA; --ink2:#8A98A5; --ink3:#5F6E7B; --ghost:#C97F9E; --energy:#D4A45C;
  --holoamt:.24;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
body{padding:14px 14px calc(20px + env(safe-area-inset-bottom))}
h1{font-size:15px;font-weight:500;margin:0 0 2px}
.sub{font-size:12px;color:var(--ink3);margin:0 0 14px}
.zlabel{font-size:10px;color:var(--ink3);letter-spacing:.06em;margin:12px 0 6px}
.field{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:12px;margin-bottom:12px}
#board{position:relative}
#floats{position:absolute;inset:0;pointer-events:none;z-index:30}
#pcv{position:absolute;inset:0;width:100%;height:100%;display:block}

.hdr{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin-bottom:7px}
.hdr b{color:var(--ink);font-weight:500}

.boardrow{display:flex;gap:10px;align-items:flex-start}
@media (max-width:400px){
  .tcol{flex:0 0 44px;min-width:44px}
  .boardrow{gap:7px}
  .ribbon{gap:7px}
  .tk .tn{font-size:8px}
}
.tcol{flex:0 0 54px;min-width:54px}
.bmain{flex:1;min-width:0}
.track{display:flex;flex-direction:column;gap:4px;padding:0}
.track{position:relative}
.tk{flex:0 0 auto;width:100%;border-radius:6px;border:1px solid var(--line);
  background:var(--raised);text-align:center;padding:4px 2px 3px;
  transition:opacity .25s,background .2s,border-color .2s}
.tk .tn{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  line-height:1.25}
.tk .tw{font-size:8px;color:var(--ink3);line-height:1.1}
.tk.now .tw{color:var(--energy)}
.tk.ultready{border-color:var(--energy);background:#332B1E;color:var(--energy);
  order:-1;animation:readypulse 1.9s ease-in-out infinite}
.tk.ultready .tn{font-weight:700;color:var(--energy)}
.tk.ultready .tw{color:#C6A05F}
.tk.bloomtok{border-color:#A89070;background:#2E2A22;color:#D9B87A}
.tk.bloomtok .tn{color:#D9B87A;font-weight:700;letter-spacing:.3px}
.tk.bloomtok.hot{border-color:#E2C083;box-shadow:0 0 14px #A89070;background:#3A3226}
.tk.now{border-color:var(--energy);background:#2E3A47}
.tk.slid{background:#3A2634;border-color:var(--ghost)}
.tk.fade{opacity:.34}
.tk.brk{opacity:.4;border-style:dashed}

.ribbon{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
.ribbon.tight{gap:6px}
.ribbon.tighter{gap:4px}
.ribbon.tight .rn{font-size:9px}
.ribbon.tighter .rn{font-size:8px;letter-spacing:-.2px}
.ribbon.tighter .rc{padding:4px 1px}
.ribbon.tighter .wk span{width:9px;font-size:7px}
.ribbon.tighter .rt{font-size:6px}
.ribbon.tighter .sv{font-size:7px;letter-spacing:1px}
.rowkey{display:flex;justify-content:space-between;font-size:9px;
  color:var(--ink3);margin-top:5px}
.rc .bar2{height:3px;border-radius:2px;background:#26313B;margin-top:2px;
  position:relative;overflow:hidden}
.rc .bar2 u{position:absolute;inset:0;width:0;display:block;text-decoration:none;
  background:#7FA8C9;transition:width .3s}
.rc{background:var(--raised);border:1px solid var(--line);border-radius:7px;
  padding:5px 3px;text-align:center;transition:opacity .2s,border-color .2s,
  transform .2s,box-shadow .3s}
.rc .rn{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .re{font-size:8px;letter-spacing:.3px}
.rc .rb{height:4px;border-radius:2px;background:#26313B;margin-top:4px;
  position:relative;overflow:hidden}
.rc .rb b{position:absolute;inset:0;background:var(--ghost);width:100%}
.rc .rb i{position:absolute;inset:0;background:var(--ink);width:100%}
.rc .sq{height:3px;border-radius:2px;background:#26313B;margin-top:2px;
  position:relative;overflow:hidden}
.rc .sq u{position:absolute;inset:0;width:100%;display:block;text-decoration:none}
.rc .rt{font-size:7px;color:var(--ink3);height:9px;line-height:9px;margin-top:1px}
.rc .en{height:2px;border-radius:1px;background:#26313B;margin-top:2px;
  position:relative;overflow:hidden}
.rc .en u{position:absolute;inset:0;width:0;display:block;text-decoration:none;
  background:var(--energy);transition:width .3s}
.rc.charged{border-color:var(--energy);box-shadow:0 0 12px var(--energy)!important;
  animation:readypulse 1.9s ease-in-out infinite}
@keyframes readypulse{0%,100%{box-shadow:0 0 10px var(--energy)}
  50%{box-shadow:0 0 20px var(--energy)}}
.rc .fr{font-size:7px;height:8px;line-height:8px;color:var(--ghost)}
.rc .sv,.sc .sv{font-size:8px;letter-spacing:2px;height:10px;line-height:10px;
  color:#8FB878}
.wk{display:flex;gap:3px;justify-content:center;margin-top:3px;height:11px}
.wk span{font-size:8px;font-weight:700;line-height:11px;width:11px;border-radius:3px;
  border:1px solid;letter-spacing:0}
.wk span.no{opacity:.25}
.sc .wk{margin-top:4px}
.rc.acting{border-color:var(--energy);background:#2E3A47;transform:translateY(-4px)}
.rc.vacated{opacity:.2;border-style:dashed;background:transparent}
.rc.down{opacity:.26}

#stage{height:214px;background:#0F161C;border:1px solid var(--line);border-radius:10px;
  position:relative;overflow:visible;margin:8px 0}
.sc{position:absolute;z-index:3;opacity:0;pointer-events:none;
  border-radius:9px;background:var(--raised);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:12px;color:var(--ink);padding:6px 7px 8px;gap:2px}
.sc.act{border-color:var(--energy);color:var(--energy);background:#2A3541}
.sc.help{border-color:var(--ink2);background:#26313C}
.foil{position:absolute;inset:0;border-radius:9px;overflow:hidden;
  pointer-events:none;z-index:0}
.sc > *:not(.foil){position:relative;z-index:1}
.rc.answering{border-color:var(--ink2);background:#2A3541}
.sc .sn{line-height:1.25;flex:0 0 auto}
.sc .se{flex:0 0 auto}
.sc .wk{flex:0 0 auto;margin-top:2px}
.sc.tinycard .sn{font-size:9px;letter-spacing:-.2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:94%}
.sc.tinycard .wk span{width:9px;font-size:7px}
.sc.tinycard .sb{width:84%;margin-top:3px}
.sc .se{font-size:8px;letter-spacing:.3px;margin-top:1px}
.sc .sb{width:76%;height:4px;border-radius:2px;background:#26313B;
  margin:4px 0 0;flex:0 0 auto;position:relative;overflow:hidden}
.sc .sb .gh{position:absolute;inset:0;background:var(--ghost);
  transition:background 200ms ease}
.sc .sb .gh.lost{background:#C4626F}
.sc .sb .gh.gained{background:#6FB87A}
.rc .rb b.lost{background:#C4626F}
.rc .rb b.gained{background:#6FB87A}
.sc .sb .fx{position:absolute;inset:0;background:var(--ink);
  transition:width 260ms cubic-bezier(.2,.8,.3,1)}
.mk{position:absolute;left:-8px;right:-8px;font-size:9px;letter-spacing:.4px;
  opacity:0;z-index:4;text-align:center;pointer-events:none}
.ptag{position:absolute;top:7px;left:10px;font-size:10px;color:var(--ink3);
  letter-spacing:.06em;z-index:9}
.cap{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:11px;
  color:var(--ink2);z-index:9}
.ai{position:absolute;border-radius:9px;border:1px solid var(--energy);
  background:#2A3541;z-index:2;pointer-events:none}

.holo{position:relative;overflow:hidden;isolation:isolate}
.holo::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  z-index:1;background:linear-gradient(112deg,transparent 22%,rgba(255,120,150,.5) 34%,
    rgba(255,205,120,.5) 40%,rgba(150,255,190,.5) 46%,rgba(120,205,255,.5) 52%,
    rgba(205,150,255,.5) 58%,transparent 70%);
  background-size:260% 260%;mix-blend-mode:color-dodge;
  filter:brightness(.78) contrast(1.25);opacity:0;transition:opacity .42s}
.holo::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  z-index:2;background:repeating-linear-gradient(-38deg,rgba(255,255,255,.10) 0 1px,
    transparent 1px 5px);background-size:200% 200%;mix-blend-mode:overlay;
  opacity:0;transition:opacity .42s}
.holo > *{position:relative;z-index:3}
.holo.lit::before{opacity:var(--holoamt);animation:hp .62s ease-out}
.holo.lit::after{opacity:calc(var(--holoamt)*.8);animation:hp .62s ease-out}
@keyframes hp{0%{background-position:8% 30%}100%{background-position:92% 70%}}

.log{height:120px;overflow-y:auto;background:#101820;border:1px solid var(--line);
  border-radius:8px;padding:8px 9px;font-size:11px;line-height:1.6;color:var(--ink2)}
.log .brk{color:var(--ghost)} .log .chain{color:var(--energy)}
.log .rnd{color:var(--ink3);border-top:1px solid var(--line);margin-top:4px;padding-top:3px}
.log .kill{color:#fff}
.stats{font-size:11px;color:var(--ink3);background:#101820;border:1px solid var(--line);
  border-radius:8px;padding:9px 10px;margin-top:10px;line-height:1.75}
.stats b{color:var(--ink);font-weight:400}
.spark{display:flex;gap:2px;align-items:flex-end;height:20px;margin-top:5px}
.spark div{flex:1;background:var(--energy);border-radius:1px;min-height:1px}

.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1 0 50%;background:transparent;border:0;border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);color:var(--ink2);padding:10px 3px;font-size:11px;
  font-family:inherit;min-height:42px}
.seg button.on{background:var(--raised);color:var(--ink)}
.btns{display:flex;gap:8px;margin-top:10px}
.btns button{flex:1;background:var(--raised);border:1px solid var(--line);color:var(--ink);
  border-radius:8px;padding:11px;font-size:13px;font-family:inherit;min-height:44px}
label{display:block;font-size:11px;color:var(--ink3);margin:11px 0 3px;overflow:hidden}
label b{float:right;color:var(--ink);font-weight:400;font-size:12px}
input[type=range]{width:100%;accent-color:var(--energy);height:26px}
#fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));
  width:54px;height:54px;border-radius:50%;background:var(--energy);color:#131A21;
  border:0;font-size:19px;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.5)}
</style>
</head>
<body>

<h1>Watchable fight</h1>
<p class="sub">Same sim, played at full ceremony.</p>

<div class="field" id="board">
  <div id="floats"><canvas id="pcv"></canvas></div>
  <div class="hdr">
    <span>Round <b id="hRound">1</b> / <b id="hMax">14</b></span>
    <span id="hState">ready</span>
  </div>
  <div class="boardrow">
    <div class="tcol">
      <div class="zlabel" style="margin:0 0 5px">Order</div>
      <div class="track" id="track"></div>
    </div>
    <div class="bmain">
      <div class="zlabel" style="margin-top:0">Enemies</div>
      <div class="ribbon" id="foes"></div>

      <div id="stage">
        <div class="ptag" id="ptag">idle</div>
        <div class="cap" id="cap">&nbsp;</div>
      </div>

      <div class="ribbon" id="crewFront"></div>
      <div class="ribbon" id="crewBack" style="margin-top:6px"></div>
      <div class="rowkey"><span>Front &mdash; takes the hits</span>
        <span>Back &mdash; shielded while the front holds</span></div>
    </div>
  </div>

  <div class="btns">
    <button id="bStep">Step</button>
    <button id="bPlay">Play</button>
    <button id="bReset">Reset</button>
  </div>
</div>

<button id="fab" aria-label="Play">&#9654;</button>

<div class="field">
  <div class="zlabel" style="margin-top:0">Battle log</div>
  <div class="log" id="log"></div>
  <div class="stats" id="stats"></div>
</div>

<div class="field">
  <div class="zlabel" style="margin-top:0">Team</div>
  <div class="seg" id="sTeam">
    <button data-v="bloom" class="on">Bloom &mdash; Blight&times;5</button>
    <button data-v="ledger">The Ledger &mdash; Assay&times;4</button>
    <button data-v="plate">Plate &amp; payback &mdash; Hull&times;4</button>
    <button data-v="relay">Relay &mdash; Drive&times;4</button>
    <button data-v="found">Found by search</button>
    <button data-v="flat">Flat &mdash; control</button>
  </div>
  <div class="zlabel">Planet</div>
  <div class="seg" id="sPlanet">
    <button data-v="order">Bastion &mdash; all Order</button>
    <button data-v="pairish">Cairn &mdash; two Order</button>
    <button data-v="spread" class="on">Verge &mdash; spread</button>
    <button data-v="away">Hollows &mdash; no Order</button>
  </div>
  <div class="stats" id="teamNote"></div>

  <div class="zlabel">Encounter</div>
  <div class="seg" id="sField">
    <button data-v="3">3 on field</button>
    <button data-v="6" class="on">6 on field</button>
    <button data-v="9">9 on field</button>
  </div>
  <label>Total enemies in the fight <b id="vPool"></b></label>
  <input type="range" id="rPool" min="3" max="24" step="1" value="12">

  <div class="zlabel">Follow-up retargeting</div>
  <div class="seg" id="sRetarget">
    <button data-v="same">Same target</button>
    <button data-v="redirect">On kill</button>
    <button data-v="random" class="on">Random</button>
    <button data-v="spread">Always spread</button>
  </div>
  <label>Chain cap <b id="vCap"></b></label>
  <input type="range" id="rCap" min="1" max="16" step="1" value="12">
  <label>Responders take the field up to <b id="vStage"></b></label>
  <input type="range" id="rStage" min="0" max="6" step="1" value="2">
  <div class="stats" id="chainNote"></div>
  <div class="zlabel">Tags in play</div>
  <div class="stats" id="tagNote" style="line-height:1.7"></div>

  <div class="zlabel">Targeting AI</div>
  <div class="seg" id="sAI">
    <button data-v="profile" class="on">Per character</button>
    <button data-v="uniform">Uniform optimal</button>
    <button data-v="naive">Lowest health</button>
  </div>
  <div class="stats" id="aiNote"></div>

  <div class="zlabel">Between fights</div>
  <div class="seg" id="sCarry">
    <button data-v="on" class="on">Injuries carry over</button>
    <button data-v="off">Fresh every fight</button>
  </div>
  <div class="btns" style="margin-top:8px">
    <button id="bNext">Next fight &rarr;</button>
    <button id="bHeal">Clear injuries</button>
  </div>
  <div class="stats" id="injNote"></div>

  <div class="zlabel">Presentation</div>
  <div class="seg" id="sMode">
    <button data-v="full" class="on">Full ceremony</button>
    <button data-v="quick">Quick</button>
    <button data-v="none">No animation</button>
  </div>
  <label>Tempo <b id="vTempo"></b></label>
  <input type="range" id="rTempo" min="40" max="200" step="5" value="100">
  <label>Particle density <b id="vDens"></b></label>
  <input type="range" id="rDens" min="0" max="250" step="10" value="100">
  <label>Bloom <b id="vBloom"></b></label>
  <input type="range" id="rBloom" min="0" max="20" step="1" value="8">
</div>

<script>
/* ============ data ============ */
var EL={order:'#7FA8C9',chaos:'#C97F9E',growth:'#8FB878',
        void:'#8F8FC9',decay:'#A89070',energy:'#D4A45C'};
var HEALC='#4FD97F', CARRY=true;
var MAXROUND=14, SHLAYERS=2, SHPER=14, UNMATCHED=0.2, SOAK=0.4;
var DEATHCOST=2, INJURY=0.65;
var EN={act:18,perHit:7,taken:9,cost:100};
var INJURED={};
var BRK={delay:.35,vuln:.35,vdur:2,regen:2}, HARM=.6;

var PLANETS={
  order:{n:'Bastion',weak:[['order','decay'],['order','energy'],['order','void']]},
  pairish:{n:'Cairn',weak:[['order','growth'],['energy','chaos'],['growth','decay']]},
  spread:{n:'Verge',weak:[['order','chaos'],['growth','void'],['decay','energy']]},
  away:{n:'The Hollows',weak:[['decay','void'],['energy','decay'],['void','chaos']]}
};
function isWeak(u,el){ return !!(u.weak && u.weak.indexOf(el)>=0); }
function coverage(team,planet){
  var els={}; TEAMS[team].crew.forEach(function(c){els[c.e]=1});
  var slots=0, hit=0, enemies=0, covered=0;
  PLANETS[planet].weak.forEach(function(w){
    enemies++; var any=false;
    w.forEach(function(e){ slots++; if(els[e]){hit++; any=true;} });
    if(any) covered++;
  });
  return {slots:slots,hit:hit,enemies:enemies,covered:covered,
          pct:Math.round(hit/slots*100)};
}
var TEAMS={
  bloom:{note:'<b>Bloom</b> \u2014 Blight\u00d75. Seeders coat the board, igniters set it off, '+
    'and at four Blight the Bloom joins the turn order and detonates everything.',
    crew:[
      {n:'Ash',e:'decay',sp:100,dmg:9,aoe:1,frac:2,shred:16,tags:['Blight'],p:'breaker',row:'front',
       bio:'Xeno-chemist. Aerosolises samples and lets the wind do the rest.',
       ult:{kind:'aoe',mult:3.0,frac:2,name:'Scatterfall'}},
      {n:'Cinder',e:'energy',sp:94,dmg:14,frac:3,tags:['Blight','Ordnance'],p:'finisher',row:'front',
       bio:'Reactor tech. Everything she touches keeps burning after she leaves.',
       ult:{kind:'nuke',mult:3.0,name:'Flashpoint'}},
      {n:'Pyre',e:'chaos',sp:92,dmg:13,detonate:1,tags:['Blight'],p:'finisher',row:'front',
       bio:'Demolitions. Waits for the pile to get big enough, then lights it.',
       ult:{kind:'nuke',mult:2.6,eat:2.2,name:'Unmaking'}},
      {n:'Sump',e:'growth',sp:98,dmg:10,frac:1,heal:20,over:1,tags:['Blight','Crew'],
       p:'opportunist',row:'back',
       bio:'Field biologist. Corruption jumps hosts when one dies; she counts on it.',
       ult:{kind:'mend',amt:28,barrier:18,name:'Bloomtide'}},
      {n:'Quill',e:'void',sp:110,dmg:10,marks:3,tags:['Blight','Assay'],p:'breaker',row:'back',
       bio:'Xeno-botanist. Tags every specimen before she touches it.',
       ult:{kind:'aoe',mult:2.2,survey:3,name:'Full Survey'}},
      {n:'Fen',e:'order',sp:106,dmg:7,heal:30,tags:['Crew'],p:'opportunist',row:'back',
       bio:'Ship medic. Treats the crew like equipment: patched before it fails.',
       ult:{kind:'mend',amt:32,name:'Field Kit'}}]},

  plate:{note:'<b>Plate and payback</b> \u2014 Hull\u00d74. Tarn drags every attack onto '+
    'herself; at four Hull the barriers stop absorbing and start answering.',
    crew:[
      {n:'Tarn',e:'order',sp:82,dmg:9,hp:78,reflect:4.4,taunt:6,tags:['Hull','Ordnance'],
       p:'bully',row:'front',
       bio:'Wears the ship\u2019s old boarding plate. Steps in front of everything.',
       ult:{kind:'lash',mult:2.4,name:'Recoil'}},
      {n:'Ballast',e:'growth',sp:74,dmg:16,hp:190,taunt:3,drain:.3,tags:['Hull'],
       p:'bully',row:'front',
       bio:'Was cargo crew. Absorbs punishment and keeps walking.',
       ult:{kind:'lash',mult:2.2,name:'Deadweight'}},
      {n:'Ferrule',e:'decay',sp:88,dmg:15,heal:16,over:1,tags:['Hull','Ordnance'],
       p:'breaker',row:'front',
       bio:'Welder. Throws plating over whoever is nearest when she swings.',
       ult:{kind:'nuke',mult:3.0,name:'Seam Split'}},
      {n:'Wex',e:'chaos',sp:104,dmg:10,heal:34,over:1,tags:['Hull','Crew'],
       p:'opportunist',row:'back',
       bio:'Hull tech. Patches things before they fail, including people.',
       ult:{kind:'mend',amt:26,barrier:30,name:'Overplate'}},
      {n:'Corr',e:'void',sp:84,dmg:26,tags:['Ordnance'],p:'finisher',row:'back',
       bio:'Ship\u2019s gunner. One target. One number.',
       ult:{kind:'nuke',mult:3.2,name:'Arc Collapse'}},
      {n:'Mire',e:'energy',sp:100,dmg:11,heal:24,over:1,reflect:.5,tags:['Crew','Hull'],
       p:'opportunist',row:'back',
       bio:'Navigator. Calm, unhurried, hits back without seeming to notice.',
       ult:{kind:'mend',amt:28,barrier:20,name:'Slack Water'}}]},

  ledger:{note:'<b>The Ledger</b> \u2014 Assay\u00d74. Quill and Vitre write targets down; '+
    'everyone else answers. At four Assay a break costs the enemy two turns.',
    crew:[
      {n:'Ledger',e:'order',sp:96,dmg:14,react:2,trig:'mark',ratio:.8,tags:['Assay','Drive'],
       p:'finisher',row:'front',
       bio:'Ship archivist. Hates away missions, brought a rifle anyway.',
       ult:{kind:'nuke',mult:3.2,name:'Final Entry'}},

function ultPolicy(u){
  if(!u.ult||u.en<EN.cost||!u.alive) return null;
  var foes=G.units.filter(function(x){return x.side==='foe'&&x.alive});
  if(!foes.length) return null;
  var k=u.ult.kind;

  if(k==='mend'){
    var hurt=G.units.filter(function(a){
      return a.side==='ally'&&a.alive&&a.hp/a.max<0.55; });
    if(hurt.length>=2) return 'the crew is hurt';
    if(hurt.some(function(a){return a.hp/a.max<0.3})) return 'someone is about to fall';
    return null;
  }
  if(k==='lash'){
    if(u.taken>=Math.round(u.max*0.55)) return 'enough stored to hurt';
    return null;
  }
  if(k==='aoe'){
    if(foes.length>=3) return 'the board is full';
    if(foes.filter(function(f){return !f.broken&&f.shL>0}).length>=3)
      return 'shields everywhere';
    return null;
  }
  // a single-target ultimate waits for a target worth spending it on
  var best=null;
  foes.forEach(function(f){
    var sl=f.broken?0:((f.shL-1)*SHPER+f.shC);
    var eff=Math.round(u.dmg*u.ult.mult*(1+(f.vuln>0?BRK.vuln:0))*
      ((!f.broken&&sl>0)?SOAK:1));
    if(eff>=f.hp) best=best||'it finishes '+f.n;
    else if(f.vuln>0) best=best||'the window is open';
    else if(f.frac>=5) best=best||'the stacks are worth it';
  });
  if(best) return best;
  // otherwise hold, unless charge would be wasted sitting at full
  if(u.heldFor>4) return 'no better moment coming';
  return null;
}

function buildStage(actorId,targetIds,support,helperIds){
  clearStage();

  var tg=targetIds||[], hp=helperIds||[];
  var actor=U(actorId);
  var pad=3+(SHLAYERS-1)*4+3;

  var FOE_Y=pad+12, ALLY_Y=H-74;

  [actorId].concat(hp).concat(tg).forEach(function(id){
    var u=U(id); if(!u) return;
    if(lanes[u.side].indexOf(id)<0) lanes[u.side].push(id);
  });

  function layout(ids,y,h,maxW){
    var n=ids.length; if(!n) return;
    // the rings live outside the card, so their width comes out of the lane
    var step=n>6?2:n>3?3:4;
    var rp=2+(SHLAYERS-1)*step+2;
    var gap=n>6?5:n>3?8:12;
    var lane=W-12-rp*2-(n-1)*gap;
    var cw=Math.max(30,Math.min(maxW,lane/n));
    var tot=n*cw+(n-1)*gap;
    var x0=Math.max(rp+2,(W-tot)/2);
    ids.forEach(function(id,k){
      geo[id]={x:x0+k*(cw+gap),y:y,w:cw,h:h,step:step,rp:rp}; });
  }

    // the only time anyone sits in the middle: an ally helping allies
    geo[actorId]={x:W/2-58,y:Math.round(H*0.24),w:116,h:60};
    layout(lanes.ally.filter(function(id){return id!==actorId}),H-76,58,100);
    layout(lanes.foe,FOE_Y,58,100);
  } else {
    layout(lanes.foe,FOE_Y,actor&&actor.side==='foe'?62:58,112);
    layout(lanes.ally,ALLY_Y,actor&&actor.side==='ally'?62:58,112);
  }

  [actorId].concat(hp).concat(tg).forEach(function(id){
    if(!geo[id]) return;
    var role = id===actorId?'actor':(hp.indexOf(id)>=0?'helper':'target');
    if(!$('sc-'+id)) makeStageCard(st,id,geo[id],role,pad);

  });

function liveFoes(){ return G.units.filter(function(u){return u.side==='foe'&&u.alive}); }
function retarget(cur){
  var fs=liveFoes(); if(!fs.length) return null;
  if(RETARGET==='same') return (cur&&cur.alive)?cur:null;
  if(RETARGET==='redirect') return (cur&&cur.alive)?cur:fs[Math.floor(Math.random()*fs.length)];
  if(RETARGET==='spread'){ var o=fs.filter(function(f){return f!==cur});
    return o.length?o[Math.floor(Math.random()*o.length)]:fs[0]; }
  return fs[Math.floor(Math.random()*fs.length)];
}
// a follow-up can set off further follow-ups; budget and cap stop the runaway
function cascade(ev,src,cur,events){
  if(ev.chains.length>=CHAINCAP) return;
  G.units.filter(function(r){
    return r.side==='ally'&&r.alive&&r.trig&&r.id!==src.id;
  }).forEach(function(r){
    if(ev.chains.length>=CHAINCAP) return;
    if(events.indexOf(r.trig)<0) return;
    G.react[r.id]=G.react[r.id]||0;
    if(G.react[r.id]>=(r.react||1)) return;
    var t=retarget(cur); if(!t) return;
    G.react[r.id]++; G.follows++;
    for(var k=0;k<(r.hits||1);k++){
      var t2=retarget(t); if(!t2) break;
      if(t2.survey>0) t2.survey--;
      var h=hit(r,t2,r.ratio); h.follow=true; h.depth=ev.chains.length;
      ev.chains.push(h);
      ev.touched=ev.touched||{}; ev.touched[t2.id]=1;
      var evs=['ally'];
      if(t2.survey>0) evs.push('mark');
      if(h.killed) evs.push('kill');
      cascade(ev,r,t2,evs);
    }
    G.units.filter(function(m){
      return m.side==='ally'&&m.alive&&m.onFollow;
    }).forEach(function(m){
      var nx=G.units.filter(function(u){
        return u.side==='ally'&&u.alive&&u.id!==m.id})
        .sort(function(a,b){return a.av-b.av})[0];

function reactTo(ev,src,tgt,depth){

function weightedPick(pool){
  // spread damage, but lean toward the wounded so pressure still builds
  var front=pool.filter(function(u){return u.row==='front'});
  if(front.length) pool=front.concat(pool.filter(function(u){return u.row!=='front'}));
  var ws=pool.map(function(u){
    var w=(1 + 1.6*(1-u.hp/u.max))*(u.taunt||1);
    if(u.row==='back') w *= front.length? 0.18 : 1;
    return w; });
  var sum=ws.reduce(function(a,b){return a+b},0), r=Math.random()*sum;
  for(var i=0;i<pool.length;i++){ r-=ws[i]; if(r<=0) return pool[i]; }
  return pool[pool.length-1];
}
function hit(src,tgt,scale){
  var amt=src.dmg*(scale||1);
  var mult=1+(tgt.vuln>0?BRK.vuln:0)+(tgt.frac||0)*0.12;
  var soaked=false, absorbed=0;
  if(tgt.side==='foe'&&!tgt.broken&&tgt.shL>0){ mult*=SOAK; soaked=true; }
  var d=Math.round(amt*mult);
  G.biggest=Math.max(G.biggest,d);
  if(src.side==='ally') G.dealt[src.n]=(G.dealt[src.n]||0)+d;
  var rawIn=d;
  if(tgt.side==='ally'&&tgt.bar>0){
    var soak2=Math.min(tgt.bar,d); tgt.bar-=soak2; d-=soak2;
    if(soak2>0){ G.barSoak=(G.barSoak||0)+soak2; absorbed=soak2;
      if(G.bon&&G.bon.ammo&&src.side==='foe'&&src.alive){
        var back=Math.round(rawIn*0.9);
        src.hp=Math.max(0,src.hp-back);
        G.ammoDmg=(G.ammoDmg||0)+back;
        if(src.hp<=0&&src.alive) src.alive=false; } }
  }
  tgt.hp=Math.max(0,tgt.hp-d);
  if(tgt.side==='ally'){ G.lowest=Math.min(G.lowest,tgt.hp);
    tgt.en=Math.min(EN.cost,tgt.en+EN.taken); tgt.taken+=d; }
  var killed=false, cost=0;
  if(tgt.hp<=0&&tgt.alive){ tgt.alive=false; killed=true;
    if(tgt.side==='ally'){ G.deaths++; G.downed.push(tgt.n);
      G.limit=Math.max(G.round+1,G.limit-DEATHCOST); cost=DEATHCOST; } }
  if(src.side==='ally'&&src.drain&&src.alive&&src.hp<src.max){
    var back=Math.round(d*src.drain);
    src.hp=Math.min(src.max,src.hp+back); G.drains++;
    return {src:src.id,tgt:tgt.id,dmg:d,vuln:tgt.vuln>0,soaked:soaked,killed:killed,
            chain:!!scale,cost:cost,drain:back}; }
  return {src:src.id,tgt:tgt.id,dmg:d,vuln:tgt.vuln>0,soaked:soaked,absorbed:absorbed,
          killed:killed,chain:!!scale,cost:cost};

      }

      at(step,function(){
        tag.textContent=kind;
        var sd=$('sc-'+h.src);
        if(sd){
          cardTF(h.src,'translateY(-16px) scale(1.06)',D(110),'cubic-bezier(.4,0,.7,.2)');
          glint(FACE(h.src),480);
        } else {
          var rcx=$('r-'+h.src);
          if(rcx){ glint(rcx,460); fz(rcx);
            rcx.style.transform='translateY(-9px) scale(1.06)';
            rcx.style.boxShadow='0 0 18px '+EL[su.e];
            setTimeout(function(){ tr(rcx,260); rcx.style.transform='';
              rcx.style.boxShadow=''; },220);
            floater(h.src,kind,EL[su.e],{tag:1}); }
        }
      });

      at(step+D(110),function(){
        var sd2=$('sc-'+h.src);
        if(sd2) cardTF(h.src,'translateY(-46px) scale(1.03)',D(80),'cubic-bezier(.8,0,.9,.2)');
      });

      at(step+D(190),function(){
        var tu=U(h.tgt);
        hitVisual(h.tgt,h.follow?.85:.6,EL[su.e]);
        floater(h.tgt,h.dmg,EL[su.e],{size:h.follow?22:17});
        floater(h.tgt,su.n,EL[su.e],{tag:1,delay:70});
        burstAt(h.tgt,EL[su.e],h.follow?10:5,h.follow?68:40);
        log('&nbsp;&nbsp;'+kind+' &mdash; '+su.n,'chain');
        logHit(h); paintUnit(tu);
        var sd3=$('sc-'+h.src);
        if(sd3) cardTF(h.src,'none',D(240),'cubic-bezier(.2,.8,.4,1)');
      });
    });
    if(ev.chains.length) t+=ev.chains.length*(quick?D(140):D(320))+D(300);
    if(ev.chains.length>CHAINSTAGE){
      at(t-D(200),function(){
        var n=ev.chains.length, hitCount=Object.keys(ev.touched||{}).length;
        floater(act.id,n+' hit chain','#D4A45C',{tag:1});
        if(hitCount>1) floater(act.id,hitCount+' enemies','#D4A45C',{tag:1,delay:120});
        log('<b>chain \u00d7'+n+'</b> across '+hitCount+' enemies','chain');
      });
    }

    var killed=ev.hits.concat(ev.chains).filter(function(h){return h.killed});
    killed.forEach(function(h){
      at(t,function(){ tag.textContent='down';
        var ku=U(h.tgt);
        log('&nbsp;&nbsp;'+ku.n+' is down','kill');
        floater(h.tgt,'down','#FFFFFF',{tag:1});
        if(h.cost){ floater(h.tgt,'\u2212'+h.cost+' rounds','#E88888',{tag:1,delay:150});
          log('&nbsp;&nbsp;time limit drops to '+G.limit+' rounds','brk');
          var hm=$('hMax'); if(hm){ hm.style.transition='none';
            hm.style.transform='scale(1.6)';
            setTimeout(function(){hm.style.transition='transform 320ms';
              hm.style.transform='none';},40); } }
        burstAt(h.tgt,EL[ku.e],14,84);
        var d=$('sc-'+h.tgt);
        if(d){ d.dataset.dead='1';
          cardTF(h.tgt,'scale(.72) rotate(-7deg)',D(600),'cubic-bezier(.42,0,.6,1)');
          d.style.opacity='0'; d.style.filter='saturate(.25)';
          var fcd=FACE(h.tgt);
          if(fcd){ fcd.style.transition='box-shadow '+D(400)+'ms'; fcd.style.boxShadow='none'; } }
        var ku2=U(h.tgt);
        if(ku2 && ku2.side==='foe'){
          U(h.tgt).retiring=true;
          setTimeout(function(){ retireFoe(h.tgt); }, D(420));
        } else {
          var rc=$('r-'+h.tgt); if(rc) setTimeout(function(){rc.classList.add('down')},D(300));
        }
      });
      t+=D(360);
    });
  }

  at(t,function(){ tag.textContent='resolve';
    cardTF(act.id,'none',D(200));
    ev.hits.concat(ev.chains).forEach(function(h){ ghostSettle(U(h.tgt)); });
    paintAll(); track(); });
  t+=D(520);
  at(t,function(){ tag.textContent='out';
    stageOut(act.id,D(180));
    pendingHelpers.forEach(function(id){stageOut(id,D(180))});
    targets.forEach(function(id){stageOut(id,D(180))}); });
  t+=D(200);
  at(t,function(){ tag.textContent='next';
    applyReset(); sweepFoes(); track(); });
  t+=D(260);
  at(t,function(){ tag.textContent='idle'; clearRibbonMarks();
    clearStage(); done&&done(); });
}
function logHit(h,why){
  var s=U(h.src), t=U(h.tgt);
  log('&nbsp;&nbsp;'+s.n+' &rarr; '+t.n+' <b>'+h.dmg+'</b>'+
    (why?' <span style="color:var(--ink3)">&mdash; '+why+'</span>':'')+
    (h.vuln?' <span style="color:#fff">vuln</span>':'')+
    (h.chain?' <span style="color:var(--energy)">chain</span>':''),
    h.chain?'chain':null);
}

/* ============ finish ============ */
function finish(msg){
  G.over=true; playing=false; clr();
  $('bPlay').textContent='Play'; $('hState').textContent=msg;
  log('<b>'+msg+'</b> in '+G.round+' rounds','rnd');
  var names=Object.keys(G.dealt);
  var tot=names.reduce(function(a,n){return a+G.dealt[n]},0)||1;
  var mean=1/names.length;
  var spread=Math.sqrt(names.reduce(function(a,n){
    return a+Math.pow(G.dealt[n]/tot-mean,2)},0)/names.length)/mean;
  var bars=names.map(function(n){
    return '<div style="height:'+Math.max(2,Math.round(G.dealt[n]/tot*100))+'%"></div>'}).join('');
  $('stats').innerHTML='<b>'+msg+'</b> in '+G.round+' rounds &middot; '+
    G.actions+' actions<br>'+
    G.breaks+' breaks &middot; '+G.chains+' chains &middot; longest <b>'+G.longest+
    '</b> &middot; suppressed <b>'+
      (G.foeTurns?Math.round(G.supp/G.foeTurns*100):0)+'%</b><br>'+
    'blooms <b>'+(G.blooms||0)+'</b> &middot; returned <b>'+(G.ammoDmg||0)+
      '</b> &middot; ultimates <b>'+G.ults+'</b> &middot; follow-ups <b>'+G.follows+
      '</b> &middot; longest chain <b>'+(G.maxChain||0)+
      '</b> &middot; biggest hit <b>'+G.biggest+'</b><br>'+
    'deaths <b>'+G.deaths+'</b> &middot; heals <b>'+G.heals+
      '</b> &middot; absorbed <b>'+(G.barSoak||0)+'</b> &middot; '+
    'drains <b>'+G.drains+'</b> &middot; lowest crew HP <b>'+G.lowest+'</b><br>'+
    'evenness <b>'+Math.max(0,Math.round((1-spread)*100))+'%</b> &middot; '+
    names.map(function(n){return n+' '+Math.round(G.dealt[n]/tot*100)+'%'}).join(' &middot; ')+
    '<div class="spark">'+bars+'</div>';
}

/* ============ controls ============ */
function step(){ if(busy||G.over) return; busy=true;
  playAction(function(){ busy=false; if(playing) step(); }); }
$('bStep').onclick=function(){ playing=false; $('bPlay').textContent='Play'; step(); };
$('bPlay').onclick=function(){ if(playing){ playing=false; this.textContent='Play'; return; }
  playing=true; this.textContent='Pause'; step(); };
$('fab').onclick=function(){ $('bPlay').click(); };
$('bReset').onclick=function(){ build(G.team,G.planet); };
function pick(id,fn){ $(id).onclick=function(e){
  var b=e.target.closest('button'); if(!b) return;
  this.querySelectorAll('button').forEach(function(x){x.classList.remove('on')});
  b.classList.add('on'); fn(b.dataset.v); }; }
pick('sTeam',function(v){ build(v,G.planet); });
pick('sPlanet',function(v){ build(G.team,v); });
pick('sMode',function(v){ MODE=v; });
pick('sCarry',function(v){ CARRY=(v==='on'); build(G.team,G.planet); });
pick('sAI',function(v){ AIMODE=v; aiNote(); build(G.team,G.planet); });
pick('sRetarget',function(v){ RETARGET=v; chainNote(); });
pick('sField',function(v){ FIELD=+v; if(POOL<FIELD){POOL=FIELD;$('rPool').value=FIELD;
  $('vPool').textContent=FIELD;} build(G.team,G.planet); });
$('rPool').oninput=function(){ POOL=Math.max(FIELD,+this.value);
  $('vPool').textContent=POOL; build(G.team,G.planet); };
$('vPool').textContent=$('rPool').value;
function chainNote(){
  var d={same:'Follow-ups stay on the original target. Chains end when it dies.',
    redirect:'Follow-ups move on only when the target dies.',
    random:'Every follow-up picks a live enemy at random \u2014 single-target units '+
      'behave like an area attack.',
    spread:'Every follow-up picks a different enemy than the last.'};
  $('chainNote').innerHTML='<span style="color:var(--ink3)">'+d[RETARGET]+
    ' Cascades longer than '+CHAINSTAGE+' stay in the ribbon and strike fast.</span>';
}
$('rCap').oninput=function(){CHAINCAP=+this.value;$('vCap').textContent=this.value;};
$('rStage').oninput=function(){CHAINSTAGE=+this.value;$('vStage').textContent=this.value;
  chainNote();};
$('vCap').textContent=$('rCap').value; $('vStage').textContent=$('rStage').value;
function aiNote(){
  if(AIMODE==='naive'){ $('aiNote').innerHTML=
    '<span style="color:var(--ink3)">Everyone attacks the weakest enemy. The control case.</span>';
    return; }
  if(AIMODE==='uniform'){ $('aiNote').innerHTML=
    '<span style="color:var(--ink3)">All four weigh the same factors identically &mdash; '+
    'strong play, but nobody has a personality.</span>'; return; }
  var t=TEAMS[G?G.team:'wide'];
  $('aiNote').innerHTML=t.crew.map(function(c){
    return '<b>'+c.n+'</b> '+(PROFILES[c.p]||{}).label; }).join(' &middot; ');
}
$('bNext').onclick=function(){
  if(G&&G.downed) G.downed.forEach(function(n){ INJURED[n]=true; });
  build(G.team,G.planet); };
$('bHeal').onclick=function(){ INJURED={}; build(G.team,G.planet); };
function injNote(){
  var names=Object.keys(INJURED);
  $('injNote').innerHTML = names.length
    ? 'Recovering: <b>'+names.join(', ')+'</b> &mdash; '+
      Math.round((1-INJURY)*100)+'% less damage this fight. '+
      '<span style="color:var(--ink3)">Press Clear injuries to rest the crew.</span>'
    : '<span style="color:var(--ink3)">Crew is healthy. A death costs '+DEATHCOST+
      ' rounds off the limit and leaves that unit recovering next fight.</span>';
}
[['rTempo','vTempo','%'],['rDens','vDens','%'],['rBloom','vBloom','px']].forEach(function(p){
  $(p[0]).oninput=function(){$(p[1]).textContent=this.value+p[2]};
  $(p[1]).textContent=$(p[0]).value+p[2]; });

pxInit();
build('bloom','spread');
window.addEventListener('resize',pxResize);
</script>
</body>
