    <radialGradient id="blue-aureole"><stop stop-color="#7bc8e9" stop-opacity=".7"/><stop offset=".55" stop-color="#68a9d9" stop-opacity=".17"/><stop offset="1" stop-color="#68a9d9" stop-opacity="0"/></radialGradient>
    <radialGradient id="honey"><stop stop-color="#fff3ac"/><stop offset=".32" stop-color="#e8ad52"/><stop offset=".76" stop-color="#b96837"/><stop offset="1" stop-color="#713f40"/></radialGradient>
