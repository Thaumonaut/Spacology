    <linearGradient id="a-center" x1="0" y1="0" x2="1" y2=".28"><stop stop-color="#a65b42"/><stop offset=".45" stop-color="#fae18a"/><stop offset=".74" stop-color="#eaa951"/><stop offset="1" stop-color="#9f5651"/></linearGradient>
    <linearGradient id="a-shadow" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#754352"/><stop offset=".55" stop-color="#a75a4c"/><stop offset="1" stop-color="#d28c54"/></linearGradient>
    <linearGradient id="b-edge" x1="0" y1="0" x2="1" y2=".18"><stop stop-color="#253f68"/><stop offset=".53" stop-color="#497cae"/><stop offset="1" stop-color="#91cfe2"/></linearGradient>
