    <filter id="paper-tooth" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".28" numOctaves="3" seed="9" result="tooth"/>
      <feComponentTransfer in="tooth" result="grain">
        <feFuncR type="table" tableValues=".65 1"/>
        <feFuncG type="table" tableValues=".65 1"/>
        <feFuncB type="table" tableValues=".65 1"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="grain" mode="multiply" result="painted"/>
      <feComposite in="painted" in2="SourceAlpha" operator="in"/>
    </filter>
    <filter id="bleed" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".025 .042" numOctaves="3" seed="17" result="flow"/>
      <feDisplacementMap in="SourceGraphic" in2="flow" scale="14" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="amber-shape">
      <path d="M270 130 333 86 389 158 434 586 371 661 264 644 213 594 218 234Z"/>
    </clipPath>
    <clipPath id="blue-shape">
      <path d="M777 83 844 26 905 92 967 566 911 660 804 678 749 599 731 207Z"/>
    </clipPath>
    <filter id="soft-glow"><feGaussianBlur stdDeviation="12"/></filter>
