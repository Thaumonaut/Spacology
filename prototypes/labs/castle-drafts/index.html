<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Castle drafts · Spacology</title>
<style>
  html,body{margin:0;height:100%;background:#cfe3f5;font:13px/1.4 system-ui,sans-serif;color:#18303a;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;cursor:grab}
  #panel{position:fixed;top:12px;left:12px;background:rgba(255,255,255,.86);border-radius:10px;padding:10px 12px;box-shadow:0 2px 10px rgba(0,0,0,.15);display:grid;gap:6px;min-width:220px}
  #panel label{display:flex;justify-content:space-between;gap:8px;align-items:center}
  #panel .row{display:flex;gap:6px}
  #panel button{flex:1;padding:4px 6px;border:1px solid #9bb;border-radius:6px;background:#fff;cursor:pointer}
  #info{font-size:12px;color:#456}
  #panel input[type=number]{width:90px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="menu" title="Panel (H)" style="position:fixed;top:12px;left:12px;z-index:3;display:none;padding:6px 10px;border-radius:8px;border:1px solid #9bb;background:rgba(255,255,255,.9);cursor:pointer">☰ Panel</button>
<div id="panel">
  <div style="display:flex;justify-content:space-between;align-items:center"><strong>Castle drafts</strong><button id="hide" title="Hide (H)" style="flex:0;padding:2px 8px">✕</button></div>
  <a href="toolkit/" style="color:#345b62;font-size:12px">Town toolkit · test street ↗</a>
  <label>Mode <select id="mode"><option value="castle">castle</option><option value="city">city</option></select></label>
  <label>Seed <input id="seed" type="number" value="1"></label>
  <div class="row"><button id="prev">◀ Prev</button><button id="next">Next ▶</button><button id="rand">Random</button></div>
  <label>Style <select id="style"><option value="">auto</option><option>island</option><option>hill</option><option>cliff</option></select></label>
  <label>River <select id="river"><option value="">auto</option><option>moat</option><option>meander</option></select></label>
  <label>Terrain <select id="terrain"><option value="">auto</option><option>flat</option><option>rolling</option><option>hilly</option></select></label>
  <label>Layout <select id="layout"><option value="">auto</option><option>rings</option><option>linked</option><option>spur</option><option>palace</option><option>cluster</option></select></label>
  <label>Light <select id="light"><option value="noon">day</option><option value="golden">golden hour</option></select></label>
  <label>Ink outlines <input id="ink" type="checkbox"></label>
  <label>Buildings <select id="bkit"><option value="kit">town kit</option><option value="draft">draft generator</option></select></label>
  <label>Voxels <select id="vox"><option value="ray">6.25 cm (ray-marched)</option><option value="0.25">25 cm</option><option value="0.125">12.5 cm</option><option value="0.5">50 cm</option><option value="0">off (mesh)</option></select></label>
  <label>Roofs <select id="palette"><option value="">auto</option></select></label>
  <label>Scale <input id="scale" type="range" min="0.6" max="2.5" step="0.1" value="1"></label>
  <label>Grid of 9 <input id="grid" type="checkbox"></label>
  <button id="walk">Walk (WASD · mouse · Shift run · Space jump · F fly · Esc)</button>
  <div id="info"></div>
  <div id="stats" style="font:11px ui-monospace,monospace;color:#456"></div>
  <div id="info2" style="font-size:11px;color:#678">Drag to orbit · wheel to zoom · ←/→ seed</div>
</div>
<script src="castle-gen.js"></script>
<script src="castle-render.js"></script>
<script src="castle-walk.js"></script>
<script src="castle-vox.js"></script>
<script src="../microvoxel-world/macro-map.js"></script>
<script src="../microvoxel-world/voxel-world-model.js"></script>
<script src="city-gen.js"></script>
<script src="toolkit/pavement-plan.js"></script>
<script src="toolkit/town-kit.js"></script>
<script>
(function(){
  'use strict';
  const $=id=>document.getElementById(id),Q=new URLSearchParams(location.search),canvas=$('c');
  const R=new CastleRender.Renderer(canvas);
  CastleGen.PALETTES.forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent=p.name;$('palette').appendChild(o);});
  const state={bkit:Q.get('bkit')||'kit',vox:Q.get('vox')||'0',light:Q.get('light')||'noon',ink:Q.get('ink')==='1',mode:Q.get('mode')||'castle',seed:+(Q.get('seed')||1),style:Q.get('style')||'',layout:Q.get('layout')||'',terrain:Q.get('terrain')||'',river:Q.get('river')||'',palette:Q.get('palette')||'',scale:+(Q.get('scale')||1),grid:Q.get('grid')==='1'};
  const cam={yaw:+(Q.get('yaw')||0.9),pitch:+(Q.get('pitch')||0.1),dist:+(Q.get('dist')||0),tx:0,ty:0,tz:0,fov:.75};
  function sync(){$('bkit').value=state.bkit;$('vox').value=state.vox;CastleRender.GROUND.vs=+state.vox;$('light').value=state.light;$('ink').checked=state.ink;R.setLight(state.light);R.ink=state.ink?1:0;$('mode').value=state.mode;$('seed').value=state.seed;$('style').value=state.style;$('layout').value=state.layout;$('terrain').value=state.terrain;$('river').value=state.river;$('palette').value=state.palette;$('scale').value=state.scale;$('grid').checked=state.grid;
    const q=new URLSearchParams({seed:state.seed,scale:state.scale});if(state.style)q.set('style',state.style);if(state.layout)q.set('layout',state.layout);if(state.terrain)q.set('terrain',state.terrain);if(state.river)q.set('river',state.river);if(state.palette!=='')q.set('palette',state.palette);if(state.grid)q.set('grid','1');if(state.mode!=='castle')q.set('mode',state.mode);if(state.light!=='noon')q.set('light',state.light);if(state.vox!=='0')q.set('vox',state.vox);if(state.bkit!=='kit')q.set('bkit',state.bkit);if(state.ink)q.set('ink','1');history.replaceState(null,'','?'+q);}
  // ---- City mode. Everything is filed into 160 m tiles: static ground/streets/walls, closed building shells (painted
  // windows and a door) and props. Props draw only within ~380 m. Interiors load per building when its door is opened
  // (E in Walk) and unload once the walker is 80 m away; that building's shell leaves its tile while it is open.
  // Meshes and colliders are built per tile on demand and cached; a tile's shell mesh is rebuilt when a door opens.
  const TILE=160,PROPS_NEAR=380;let city=null;const tileCache=new Map(),opened=new Map();
  const tkey=(x,z)=>Math.floor(x/TILE)+','+Math.floor(z/TILE);
  const buildCost={};
  function cached(id,make){if(!tileCache.has(id)){const t0=performance.now(),m=make(),t1=performance.now();tileCache.set(id,{key:'city'+city.seed+':'+id,mesh:m,col:new CastleWalk.Collider(m)});const kind=id.split(':')[0],e=buildCost[kind]||(buildCost[kind]={n:0,mesh:0,col:0});e.n++;e.mesh+=t1-t0;e.col+=performance.now()-t1;}return tileCache.get(id);}
  // Buildings drawn by ray marching leave their tile's shell mesh (like opened ones); they keep a collider of their shell.
  const out=b=>opened.has(b.id)||rayShown.has(b.id);
  function shells(k){const T=city.tiles.get(k),ver=T.b.filter(out).map(b=>b.id).join('.');
    return cached('ext:'+k+':'+ver,()=>{const m=new CastleRender.Mesh();for(const b of T.b)if(!out(b)){const f=m.p.length/3;m.bid=b.id+1;CastleRender.meshParts(CityGen.buildingParts(b,false),city.palette,0,0,m);if(b.type!=='cathedral'&&!b.hero)CastleRender.wonk(m,f,b);}return m;});}
  // Street-level detail for the tiles round the walker (or round the view's focus when zoomed in close).
  function shellsNear(k){const T=city.tiles.get(k),ver=T.b.filter(out).map(b=>b.id).join('.');
    return cached('near:'+k+':'+ver+':'+state.vox+':'+state.bkit,()=>{const m=new CastleRender.Mesh(),vs=+state.vox,t0=performance.now();
      for(const b of T.b){if(out(b))continue;const parts=CityGen.buildingParts(b,'near');
        // Each building is a voxel model in its own rotated grid; what the voxeliser leaves (people, water) is meshed.
        if(vs>0){const V=CastleVox.voxelize(parts,{x:b.x,z:b.z,rot:b.rot},vs,CastleRender.colourOf(city.palette),CastleRender.patOf);CastleVox.meshVox(V,{x:b.x,z:b.z,rot:b.rot},m);CastleRender.meshParts(V.rest,city.palette,0,0,m);}
        else{const f=m.p.length/3;CastleRender.meshParts(parts,city.palette,0,0,m);if(b.type!=='cathedral'&&!b.hero)CastleRender.wonk(m,f,b);}}
      voxStats.ms+=performance.now()-t0;voxStats.tiles++;return m;});}
  const voxStats={ms:0,tiles:0};
  // ---- Town kit buildings in the city. Each city plot (centre, width along the street, depth, rotation, door side,
  // floor datum) is built by TownKit.building in its local frame (front +Z) and placed by the plot's frame; a door on
  // the -v side turns the model half round. City types map to kit variants by a per-plot hash. Ground pads
  // (surfacePatch) are left to the city's own ground. Heroes and civic buildings keep the draft models.
  // ---- Kit streaming. Kit buildings are built per 40 m cell by a worker pool, never on the main thread. A cell is
  // wanted when any of its buildings is within KIT_IN of the walker (or the view's focus when zoomed in) and kept
  // until all are beyond KIT_OUT (hysteresis, so cells do not churn at the edge). A built, wanted cell is drawn and its
  // buildings are hidden in the shared shell meshes on the GPU (Renderer.setHidden): no shell mesh is rebuilt. Built
  // cells stay cached (up to KIT_KEEP), so walking back is free.
  const KIT_IN=75,KIT_OUT=110,KIT_CELL=40,KIT_KEEP=30,kitCells=new Map(),kitWant=new Set(),kitQueue=[],kitJobs=new Set(),kitPool=[];let kitIds=null;
  const kcell=b=>Math.floor(b.x/KIT_CELL)+','+Math.floor(b.z/KIT_CELL);
  // ---- City workers: each generates the same city and builds tile and kit-cell meshes on request (city-worker.js),
  // returning packed vertex buffers and collision triangles. The main thread only uploads. Requests are queued nearest
  // first; results land in gpuTiles and trigger a (throttled) refresh. Colliders are made lazily, for near tiles only.
  const cityPool=[],gpuTiles=new Map(),gpuPending=new Map(),gpuQueue=[],kitStats={n:0,ms:0};let gpuSeq=0,poolSeed=null;
  if(window.Worker)for(let i=0;i<Math.max(2,Math.min(4,(navigator.hardwareConcurrency||4)-2));i++){const w=new Worker('city-worker.js');w.busy=true;w.ready=false;
    w.onmessage=e=>{const d=e.data;if(d.ready){w.ready=true;w.busy=false;w.seed=d.seed;gpuPump();return;}w.busy=false;const id=d.kind+':'+d.key;gpuPending.delete(id);
      if(city&&d.seed===city.seed&&d.seed===poolSeed){gpuTiles.set(id,{key:'gpu'+city.seed+':'+id,mesh:{packed:d.packed},tris:d.tris,col:null,used:performance.now()});if(d.kind==='kit'){kitStats.n++;kitStats.ms+=d.ms;}scheduleRefresh();}gpuPump();};cityPool.push(w);}
  function poolInit(){poolSeed=city.seed;gpuTiles.forEach(v=>R.drop(v.key));gpuTiles.clear();gpuPending.clear();gpuQueue.length=0;for(const w of cityPool){w.ready=false;w.busy=true;w.postMessage({init:true,seed:city.seed,opts:city.genOpts});}}
  const UPLOAD_BUDGET=6e6;
  const useGpu=()=>cityPool.length&&state.bkit==='kit'&&state.vox==='0'&&!opened.size&&!rayShown.size;
  function gpuGet(kind,key,prio){const id=kind+':'+key,t=gpuTiles.get(id);if(t){t.used=performance.now();return t;}if(!gpuPending.has(id)){gpuPending.set(id,prio);gpuQueue.push({id,kind,key,prio});}else gpuPending.set(id,Math.min(gpuPending.get(id),prio));return null;}
  function gpuPump(){gpuQueue.sort((a,b)=>(gpuPending.get(a.id)??a.prio)-(gpuPending.get(b.id)??b.prio));for(const w of cityPool){if(w.busy||!w.ready||w.seed!==poolSeed||!gpuQueue.length)continue;const q=gpuQueue.shift();w.busy=true;w.postMessage({id:++gpuSeq,kind:q.kind,key:q.key});}}
  const gpuCol=t=>t.col||(t.col=new CastleWalk.Collider({p:t.tris,k:new Uint8Array(t.tris.length/9).fill(1),id:[]}));
  function kitPump(){}
  function updateKit(){if(!city||state.bkit!=='kit'){kitWant.clear();return;}if(!city.kitByCell){city.kitByCell=new Map();for(const b of city.buildings)if(KIT_MAP[b.type]&&!b.hero){const k=kcell(b);if(!city.kitByCell.has(k))city.kitByCell.set(k,[]);city.kitByCell.get(k).push(b.id);}}
    const f=walker?{x:walker.x,z:walker.z}:cam.dist<500?{x:cam.tx,z:cam.tz}:null,next=new Set();
    if(f)for(const [key,ids] of city.kitByCell){let dmin=1e9;for(const id of ids){const b=city.buildings[id];dmin=Math.min(dmin,Math.hypot(b.x-f.x,b.z-f.z));}if(dmin<KIT_IN||(kitWant.has(key)&&dmin<KIT_OUT))next.add(key);}
    kitWant.clear();for(const k of next)kitWant.add(k);
    // Kit cells come from the city workers, nearest first (ahead of tiles further out).
    for(const k of kitWant){const [i,j]=k.split(',').map(Number);gpuGet('kit',k,Math.hypot((i+.5)*KIT_CELL-f.x,(j+.5)*KIT_CELL-f.z)*.5);}gpuPump();
    // Evict the least recently wanted cells beyond the cache size.
    {const kits=[...gpuTiles].filter(([k])=>k.startsWith('kit:')&&!kitWant.has(k.slice(4)));if(kits.length>KIT_KEEP){kits.sort((a,b)=>a[1].used-b[1].used);for(const [k,v] of kits.slice(0,kits.length-KIT_KEEP)){R.drop(v.key);gpuTiles.delete(k);}}}}
  function kitVariant(b){const pool=KIT_MAP[b.type],list=pool==='HOME'?TownKit.HOME_KINDS.filter(v=>!TownKit.COMPOUND_KINDS.includes(v)):pool==='STORE'?TownKit.STORE_KINDS:pool==='SLUM'?TownKit.SLUM_KINDS:pool;return list[b.seed%list.length];}
  const KIT_MAP={house:'HOME',shop:'STORE',inn:['inn'],smithy:['smithy'],warehouse:['warehouse'],towerhouse:['towerhouse'],shack:'SLUM',barracks:['house'],chapel:['chapel'],bath:['house']};
  const KIT_ROOFS=[[.34,.4,.4],[.43,.29,.24],[.31,.4,.33],[.29,.34,.43],[.62,.3,.24]];
  function kitParts(b){const pool=KIT_MAP[b.type];if(!pool||b.hero)return null;const list=pool==='HOME'?TownKit.HOME_KINDS.filter(v=>!TownKit.COMPOUND_KINDS.includes(v)):pool==='STORE'?TownKit.STORE_KINDS:pool==='SLUM'?TownKit.SLUM_KINDS:pool;
    const variant=list[b.seed%list.length],T=TownKit.TYPES[variant]||{},rot=b.rot+(b.doorSide<0?Math.PI:0),c=Math.cos(rot),sn=Math.sin(rot);
    const ground=(lx,lz)=>city.gy(b.x+lx*c-lz*sn,b.z+lx*sn+lz*c);// local frame of the lot (front +Z)
    const dk=Math.min(b.d,T.d?Math.max(T.d,b.d*.8):b.d),sh=(b.d-dk)/2;
    // A kit model shallower than its lot keeps its front on the lot's front line (the street), not the lot's centre.
    let k;try{k=TownKit.building({...T,id:'c'+b.id,variant,x:0,z:sh,w:b.w,d:dk,storeys:Math.max(T.storeys||2,Math.min(4,b.storeys.length)),floor:b.floor,ground,roofCol:KIT_ROOFS[b.seed%KIT_ROOFS.length]});}catch(e){return null;}
    return TownKit.transform(k.parts.filter(p=>p.t!=='surfacePatch'),b.x,0,b.z,rot);}
  // Trees from the voxel world: a {t:'tree'} placeholder grows that species with the world's own generator (trunk and
  // branch tubes, crown lobes, conifer bough tiers), turned into parts here. One world instance, made on first use.
  let treeWorld=null;const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255),MATC=i=>hex(MicroWorld.COLORS[i]||'#558855');
  function worldTree(p){if(!treeWorld)treeWorld=MicroWorld.createWorld(1,.25,'infinite');const {parts:T}=treeWorld.growTreeParts(p.species,p.x,p.z,p.y,{k:.85*(p.size||1),cls:1}),out=[],dy=p.y-0;
    for(let i=0;i<T.segs.length;i+=10){const [x0,y0,z0,r0,x1,y1,z1,r1,mat]=T.segs.slice(i,i+10);out.push({t:'beam',x0,y0,z0,x1,y1,z1,s:Math.max(.2,r0+r1),col:MATC(mat),nocol:true});}
    for(let i=0;i<T.lobes.length;i+=6){const [x,y,z,r,ys,mat]=T.lobes.slice(i,i+6);out.push({t:'blob',x,y,z,rx:r,ry:r*ys,rz:r,col:MATC(mat),nocol:true});}
    for(let i=0;i<T.tiers.length;i+=8){const [x,z,top,bot,r,rt,sd,mat]=T.tiers.slice(i,i+8);out.push({t:'cone',x,y:bot,z,r,h:top-bot,col:MATC(mat),nocol:true});}
    return out;}
  const withTrees=parts=>parts.some(p=>p.t==='tree')?parts.flatMap(p=>p.t==='tree'?worldTree(p):[p]):parts;
  // Props near the walker are voxel models too (stalls, lanterns, trees, benches, fountains); people stay meshes.
  function propsNear(k){return cached('pnear:'+k+':'+state.vox,()=>{const m=new CastleRender.Mesh(),vs=+state.vox;for(const p0 of city.tiles.get(k).p){const p={...p0,parts:withTrees(p0.parts)};
      if(vs>0){const V=CastleVox.voxelize(p.parts,{x:p.x,z:p.z,rot:0},vs,CastleRender.colourOf(city.palette),CastleRender.patOf);CastleVox.meshVox(V,{x:p.x,z:p.z,rot:0},m);CastleRender.meshParts(V.rest,city.palette,0,0,m);}
      else CastleRender.meshParts(p.parts,city.palette,0,0,m);}return m;});}
  const propsOf=k=>cached('props:'+k,()=>{const m=new CastleRender.Mesh();for(const b of city.tiles.get(k).p)CastleRender.meshParts(withTrees(b.parts),city.palette,0,0,m);return m;});
  const staticOf=k=>cached('static:'+k,()=>CastleRender.meshParts(city.tiles.get(k).s,city.palette));
  const interiorOf=b=>cached('int:'+b.id,()=>CastleRender.meshParts(CityGen.buildingParts(b,true),city.palette));
  function cityList(focus){const list=[city.water,city.castleMesh],cols=[city.castleMesh.col],tw=walker?[Math.floor(walker.x/TILE),Math.floor(walker.z/TILE)]:null,
      dt=walker?tw:cam.dist<700?[Math.floor(cam.tx/TILE),Math.floor(cam.tz/TILE)]:null;
    if(useGpu()){const hide=[],cand=[];
      // Upload budget: meshes already on the GPU always draw; new ones go up nearest first, at most UPLOAD_BUDGET bytes
      // per refresh, and a follow-up refresh takes the rest, so arrivals never land on one frame together.
      const ready=t=>R.cache.has(t.key);
      for(const [k,T] of city.tiles){const [i,j]=k.split(',').map(Number),near=tw&&Math.abs(i-tw[0])<=1&&Math.abs(j-tw[1])<=1,cx=(i+.5)*TILE,cz=(j+.5)*TILE,dd=Math.hypot(cx-focus.x,cz-focus.z);
        for(const [kind,has,want] of [['static',T.s.length,true],['ext',T.b.length,true],['props',T.p.length,dd<PROPS_NEAR]]){if(!has||!want)continue;const t=gpuGet(kind,k,dd+(kind==='props'?40:0));if(t)cand.push({t,dd,near});}}
      for(const k of kitWant){const t=gpuTiles.get('kit:'+k);if(t){const [i,j]=k.split(',').map(Number);t.used=performance.now();cand.push({t,dd:Math.hypot((i+.5)*KIT_CELL-focus.x,(j+.5)*KIT_CELL-focus.z)*.5,kit:k});}}
      cand.sort((a,b)=>(ready(b.t)-ready(a.t))||a.dd-b.dd);let budget=UPLOAD_BUDGET,held=false;
      for(const c of cand){if(!ready(c.t)){if(budget<=0){held=true;continue;}budget-=c.t.mesh.packed.buf.byteLength;}list.push(c.t);if(c.near)cols.push(gpuCol(c.t));if(c.kit)hide.push(...city.kitByCell.get(c.kit));}
      if(held)setTimeout(scheduleRefresh,0);
      const hk=hide.join(',');if(hk!==kitIds){kitIds=hk;R.setHidden(hide);}gpuPump();return {list,collider:new CastleWalk.Multi(cols)};}
    for(const [k,T] of city.tiles){const [i,j]=k.split(',').map(Number),near=tw&&Math.abs(i-tw[0])<=1&&Math.abs(j-tw[1])<=1,cx=(i+.5)*TILE,cz=(j+.5)*TILE;
      if(T.s.length){const t=staticOf(k);list.push(t);if(near)cols.push(t.col);}
      const detail=dt&&Math.abs(i-dt[0])<=1&&Math.abs(j-dt[1])<=1;
      if(T.b.length){const t=detail&&state.vox!=='ray'&&state.bkit!=='kit'?shellsNear(k):shells(k);list.push(t);if(near)cols.push(t.col);}
      if(T.p.length&&Math.hypot(cx-focus.x,cz-focus.z)<PROPS_NEAR){const t=detail?propsNear(k):propsOf(k);list.push(t);if(near)cols.push(t.col);}}
    for(const b of opened.values()){const t=interiorOf(b);list.push(t);cols.push(t.col);}
    // Built, wanted kit cells draw; their buildings are hidden in the shells.
    if(kitIds!==''){kitIds='';R.setHidden([]);}
    for(const id of rayShown){const b=city.buildings[id];cols.push(cached('rcol:'+id,()=>CastleRender.meshParts(CityGen.buildingParts(b,false),city.palette)).col);}
    return {list,collider:new CastleWalk.Multi(cols)};}
  // ---- Ray-marched buildings: those within RAY_R of the walker (or the view's focus when zoomed in) are voxelised at
  // 6.25 cm by a pool of workers and swap in when ready (the plain shell shows until then); models beyond 1.4x the radius
  // are released. Colours and patterns are resolved here, so the workers need only castle-vox.js.
  const RAY_R=95,pool=[],jobs=new Map(),rayShown=new Set(),rayWant=new Set();let rayStats={ms:0,n:0};
  if(window.Worker)for(let i=0;i<Math.max(2,Math.min(6,(navigator.hardwareConcurrency||4)-1));i++){const w=new Worker('castle-vox-worker.js');w.busy=false;
    w.onmessage=e=>{w.busy=false;const d=e.data,j=jobs.get(d.id);jobs.delete(d.id);rayStats.ms+=d.ms;rayStats.n++;
      if(city&&j&&j.seed===city.seed&&!d.empty&&rayWant.has(d.id)){R.uploadRay('ray:'+city.seed+':'+d.id,d,j.F);rayShown.add(d.id);R.setRays([...rayShown].map(id=>'ray:'+city.seed+':'+id));scheduleRefresh();}pump();};pool.push(w);}
  const queue=[];function pump(){for(const w of pool){if(w.busy||!queue.length)continue;const id=queue.shift();if(!rayWant.has(id)||jobs.has(id))continue;const b=city.buildings[id],F={x:b.x,z:b.z,rot:b.rot};
      const parts=CityGen.buildingParts(b,'near').map(p=>({...p,col:CastleRender.colourOf(city.palette)(p),pat:CastleRender.patOf(p)}));jobs.set(id,{seed:city.seed,F});w.busy=true;w.postMessage({id,parts,frame:F,cvs:.25});}}
  let refreshPending=false;function scheduleRefresh(){if(refreshPending)return;refreshPending=true;setTimeout(()=>{refreshPending=false;refreshCity();draw();},120);}
  function updateRays(){if(!city||state.vox!=='ray'||!pool.length){if(rayShown.size){for(const id of rayShown)R.dropRay('ray:'+city.seed+':'+id);rayShown.clear();rayWant.clear();R.setRays([]);}return;}
    const f=walker?{x:walker.x,z:walker.z}:cam.dist<500?{x:cam.tx,z:cam.tz}:null;rayWant.clear();
    if(f){const near=city.buildings.filter(b=>DETAILED_RAY.has(b.type)&&Math.hypot(b.x-f.x,b.z-f.z)<RAY_R).sort((a,b)=>Math.hypot(a.x-f.x,a.z-f.z)-Math.hypot(b.x-f.x,b.z-f.z));
      for(const b of near){rayWant.add(b.id);if(!rayShown.has(b.id)&&!jobs.has(b.id)&&!queue.includes(b.id))queue.push(b.id);}}
    let dropped=false;for(const id of [...rayShown]){const b=city.buildings[id];if(!f||Math.hypot(b.x-f.x,b.z-f.z)>RAY_R*1.4){R.dropRay('ray:'+city.seed+':'+id);rayShown.delete(id);dropped=true;}}
    if(dropped){R.setRays([...rayShown].map(id=>'ray:'+city.seed+':'+id));refreshCity();}
    queue.sort((a,b)=>{const A=city.buildings[a],B=city.buildings[b];return Math.hypot(A.x-f.x,A.z-f.z)-Math.hypot(B.x-f.x,B.z-f.z);});pump();}
  const DETAILED_RAY=new Set(['house','shop','inn','towerhouse','smithy','warehouse','barracks','chapel','guildhall','market','bath','shack']);
  const refreshCost={kit:0,list:0,upload:0,n:0,worst:0};
  function refreshCity(){const t0=performance.now();updateKit();const t1=performance.now(),f=walker?{x:walker.x,z:walker.z}:{x:cam.tx,z:cam.tz},{list,collider}=cityList(f);const t2=performance.now();R.setMeshes(list);const t3=performance.now();if(walker)walker.col=collider;state.collider=collider;
    refreshCost.kit+=t1-t0;refreshCost.list+=t2-t1;refreshCost.upload+=t3-t2;refreshCost.n++;refreshCost.worst=Math.max(refreshCost.worst,t3-t0);}
  // Doors: the outside door point of a building, and the nearest one within reach of the walker.
  function doorPoint(b){const c=Math.cos(b.rot),s=Math.sin(b.rot),v=b.doorSide*(b.d/2+.8),u=b.doorU||0;return [b.x+u*c-v*s,b.z+u*s+v*c];}
  function nearestDoor(){let best=null;const k=[Math.floor(walker.x/TILE),Math.floor(walker.z/TILE)];
    for(let di=-1;di<=1;di++)for(let dj=-1;dj<=1;dj++){const T=city.tiles.get((k[0]+di)+','+(k[1]+dj));if(!T)continue;for(const b of T.b){if(b.type==='market')continue;const [x,z]=doorPoint(b),d=Math.hypot(x-walker.x,z-walker.z);if(d<3.2&&(!best||d<best.d))best={b,d};}}return best&&best.b;}
  // Interiors are parked while the city's scale and layout are worked out (?interiors=1 turns doors back on).
  function toggleDoor(){if(!walker||state.mode!=='city'||Q.get('interiors')!=='1')return;const b=nearestDoor();if(!b)return;if(opened.has(b.id))opened.delete(b.id);else opened.set(b.id,b);refreshCity();}
  function closeFar(){let changed=false;for(const [id,b] of opened)if(Math.hypot(b.x-walker.x,b.z-walker.z)>80){opened.delete(id);changed=true;}return changed;}
  function buildCity(){kitWant.clear();kitQueue.length=0;kitIds=null;R.setHidden([]);tileCache.clear();opened.clear();for(const id of rayShown)R.dropRay('ray:'+(city&&city.seed)+':'+id);rayShown.clear();rayWant.clear();queue.length=0;R.setRays([]);lastRayAt=null;for(const k of [...R.cache.keys()])R.drop(k);
    {const genOpts={scale:state.scale,terrain:state.terrain||undefined,river:state.river||undefined,castleLayout:state.layout||undefined};city=CityGen.generate(state.seed,genOpts);city.genOpts=JSON.parse(JSON.stringify(genOpts));}
    if(cityPool.length)poolInit();city.tiles=new Map();const T=k=>{if(!city.tiles.has(k))city.tiles.set(k,{b:[],p:[],s:[]});return city.tiles.get(k);};
    for(const b of city.buildings)T(tkey(b.x,b.z)).b.push(b);for(const p of city.props)T(tkey(p.x,p.z)).p.push(p);
    for(const p of city.parts){const x=p.x??p.x0??p.cx??0,z=p.z??p.z0??p.cz??0;T(tkey(x,z)).s.push(p);}
    const cm=CastleRender.meshParts(city.castle.parts,city.castle.palette,city.castleAt.x,city.castleAt.z);
    city.castleMesh={key:'city'+city.seed+':castle',mesh:cm,col:new CastleWalk.Collider(cm)};city.water={key:'water',mesh:CastleRender.waterMesh()};
    state.castle={spawn:city.spawn};cam.tx=0;cam.tz=0;cam.ty=40;if(!Q.get('dist')||state._moved)cam.dist=city.radius*2.1;
    R.bounds={cx:0,cz:0,r:city.radius+120,h:80};refreshCity();
    const n={};for(const b of city.buildings)n[b.type]=(n[b.type]||0)+1;
    $('info').textContent=`City ${state.seed} · ${Math.round(city.radius*2)} m across · ${city.buildings.length} buildings · ${Object.entries(n).sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+' '+v).join(', ')}`;
    sync();draw();}
  function rebuild(){
    if(state.mode==='city'){buildCity();if(walker)startWalk();return;}
    cam.tx=0;cam.tz=0;
    const opts={style:state.style||undefined,layout:state.layout||undefined,palette:state.palette===''?undefined:+state.palette,scale:state.scale},list=[];
    if(state.grid){for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const s=state.seed+(j+1)*3+(i+1);const castle=CastleGen.generate(s,opts);castle.parts=castle.parts.filter(p=>p.t!=='shore');list.push({castle,ox:i*1300*state.scale,oz:j*1300*state.scale});}}
    else list.push({castle:CastleGen.generate(state.seed,opts),ox:0,oz:0});
    const c=list[Math.floor(list.length/2)].castle,span=state.grid?2000*state.scale:c.radius*2.4;
    const mesh=CastleRender.build(list);state.castle=c;state.collider=state.grid?null:new CastleWalk.Collider(mesh);if(walker)startWalk();
    R.setMesh(mesh,{cx:0,cz:0,r:state.grid?2200*state.scale:Math.max(c.radius*2.2,700*state.scale),h:c.height});
    // Frame the castle itself (above its seat), not the hill or island under it.
    const rise=c.height-c.top;if(!Q.get('dist')||state._moved)cam.dist=state.grid?span*1.45:Math.max(c.radius*2.6,rise*2.4);cam.ty=state.grid?0:c.top+rise*.35;
    $('info').textContent=state.grid?`Seeds ${state.seed}–${state.seed+8}`:`Seed ${c.seed} · ${c.layout} · ${c.style} · ${c.palette.name} · ${Math.round(c.radius*2)} m across · ${Math.round(c.height)} m tall · ${c.parts.length} parts`;
    sync();draw();}
  function draw(){const dpr=Math.min(2,devicePixelRatio||1);if(canvas.width!==innerWidth*dpr||canvas.height!==innerHeight*dpr){canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;}
    const t0=performance.now();R.draw(cam);const st=R.stats||{};$('stats').textContent=`${st.drawn}/${st.meshes} meshes · ${(st.tris/1000).toFixed(0)}k tris (+${(st.shadowTris/1000).toFixed(0)}k shadow) · ${(performance.now()-t0).toFixed(1)} ms cpu`+(state.mode==='city'?` · ${opened.size} open`:'');window.CastleDrafts.frames++;}
  // ---- Walk: first person against the castle mesh; pointer lock for mouse look.
  let walker=null,last=0;
  function startWalk(){if(state.grid){state.grid=false;rebuild();return;}walkTile='';
    if(state.mode==='city'){walker={x:state.castle.spawn.x,z:state.castle.spawn.z};refreshCity();}
    panel(false);walker=new CastleWalk.Walker(state.collider,state.castle.spawn);follow();shadowNear();walker.spawn0={...state.castle.spawn,y:walker.y};cam.fp=walker.camera();$('walk').textContent='Exit walk (Esc)';requestAnimationFrame(tick);}
  function stopWalk(){walker=null;cam.fp=null;cam.shadowFocus=null;if(state.mode==='city'&&city){opened.clear();refreshCity();}$('walk').textContent='Walk (WASD · mouse · Shift run · Space jump · F fly · Esc)';if(document.pointerLockElement)document.exitPointerLock();draw();}
  // In the city, the interior ring follows the walker tile by tile.
  let walkTile='',lastRayAt=null;function follow(){if(state.mode!=='city'||!walker)return;if(!lastRayAt||Math.hypot(walker.x-lastRayAt[0],walker.z-lastRayAt[1])>12){lastRayAt=[walker.x,walker.z];updateRays();if(state.bkit==='kit'){walkTile=tkey(walker.x,walker.z);refreshCity();return;}}const k=tkey(walker.x,walker.z),far=closeFar();if(k===walkTile&&!far)return;walkTile=k;refreshCity();}
  function shadowNear(){cam.shadowFocus=walker&&state.mode==='city'?{cx:walker.x,cz:walker.z,r:260,h:(walker.y+20)/.3}:null;}
  function tick(t){if(!walker)return;const dt=Math.min(.05,(t-(last||t))/1000);last=t;walker.update(dt);follow();shadowNear();cam.fp=walker.camera();draw();requestAnimationFrame(tick);}
  $('walk').onclick=()=>walker?stopWalk():startWalk();
  const KEY={KeyW:'w',KeyA:'a',KeyS:'s',KeyD:'d',ArrowUp:'w',ArrowDown:'s',ShiftLeft:'shift',ShiftRight:'shift',Space:'space',KeyC:'c'};
  addEventListener('keydown',e=>{if(!walker)return;if(KEY[e.code]){walker.keys[KEY[e.code]]=true;e.preventDefault();}if(e.code==='KeyF')walker.fly=!walker.fly;if(e.code==='KeyE')toggleDoor();if(e.code==='Escape')stopWalk();});
  addEventListener('keyup',e=>{if(walker&&KEY[e.code])walker.keys[KEY[e.code]]=false;});
  addEventListener('mousemove',e=>{if(!walker||document.pointerLockElement!==canvas)return;walker.yaw+=e.movementX*.0025;walker.pitch=Math.max(-1.4,Math.min(1.4,walker.pitch-e.movementY*.0025));});
  // The panel folds away (H, the ✕, or entering Walk) to a small ☰ button.
  const panel=v=>{$('panel').style.display=v?'':'none';$('menu').style.display=v?'none':'';};$('hide').onclick=()=>panel(false);$('menu').onclick=()=>panel(true);
  addEventListener('keydown',e=>{if(e.code==='KeyH'&&e.target.tagName!=='INPUT')panel($('panel').style.display==='none');});
  window.CastleDrafts={frames:0,state,cam,rebuild,draw,
    // Headless helpers: start Walk, step it, or place the walker.
    walk:()=>startWalk(),step:(keys,seconds)=>{Object.assign(walker.keys,keys);for(let i=0;i<seconds*30;i++){walker.update(1/30);follow();}walker.keys={};shadowNear();cam.fp=walker.camera();draw();return {x:walker.x,y:walker.y,z:walker.z};},
    // Streaming only (no draw), for timing the main thread's share of a walk.
    dbg:()=>({list:R.list.length,kitInList:[...R.cache.keys()].filter(k=>k.includes(':kit:')).length,hidden:(kitIds||'').split(',').length,want:kitWant.size,useGpu:!!useGpu(),walker:walker&&[walker.x|0,walker.z|0]}),
    stream:(x,z)=>{walker.x=x;walker.z=z;follow();},
    place:(x,y,z,yaw,pitch=0)=>{Object.assign(walker,{x,y,z,yaw,pitch,vy:0});follow();shadowNear();cam.fp=walker.camera();draw();},city:()=>city,openDoor:id=>{const b=city.buildings[id];opened.set(b.id,b);refreshCity();draw();},stats:()=>({...R.stats,gpuBytes:[...gpuTiles].reduce((o,[k,v])=>{const t=k.split(':')[0];o[t]=(o[t]||0)+Math.round(v.mesh.packed.buf.byteLength/1e6);return o;},{}),gpuTiles:gpuTiles.size,gpuQueue:gpuQueue.length,up:R.upStats,buildCost,refreshCost,kitCells:[...kitWant].filter(k=>gpuTiles.has('kit:'+k)).length+'/'+kitWant.size,kitAvgMs:kitStats.n?Math.round(kitStats.ms/kitStats.n):0,rayJobs:jobs.size+queue.length,rayAvgMs:rayStats.n?Math.round(rayStats.ms/rayStats.n):0,voxMs:Math.round(voxStats.ms),voxTiles:voxStats.tiles}),doorPoint:b=>doorPoint(b),walker:()=>walker};
  const set=(k,v)=>{state[k]=v;state._moved=true;rebuild();};
  $('seed').onchange=e=>set('seed',+e.target.value);$('prev').onclick=()=>set('seed',state.seed-(state.grid?9:1));$('next').onclick=()=>set('seed',state.seed+(state.grid?9:1));
  $('mode').onchange=e=>set('mode',e.target.value);$('bkit').onchange=e=>{state.bkit=e.target.value;state._moved=true;sync();rebuild();};$('vox').onchange=e=>{state.vox=e.target.value;state._moved=true;sync();rebuild();};$('light').onchange=e=>{state.light=e.target.value;sync();draw();};$('ink').onchange=e=>{state.ink=e.target.checked;sync();draw();};$('rand').onclick=()=>set('seed',Math.floor(Math.random()*99999));$('style').onchange=e=>set('style',e.target.value);$('layout').onchange=e=>set('layout',e.target.value);$('terrain').onchange=e=>set('terrain',e.target.value);$('river').onchange=e=>set('river',e.target.value);$('palette').onchange=e=>set('palette',e.target.value);
  $('scale').oninput=e=>set('scale',+e.target.value);$('grid').onchange=e=>set('grid',e.target.checked);
  addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||walker)return;if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click();});
  let drag=null;canvas.onpointerdown=e=>{if(walker){canvas.requestPointerLock();return;}drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);};
  canvas.onpointermove=e=>{if(!drag)return;cam.yaw+=(e.clientX-drag[0])*.006;cam.pitch=Math.max(.02,Math.min(1.45,cam.pitch+(e.clientY-drag[1])*.005));drag=[e.clientX,e.clientY];draw();};
  canvas.onpointerup=()=>drag=null;canvas.onwheel=e=>{e.preventDefault();cam.dist*=Math.exp(e.deltaY*.001);draw();};
  addEventListener('resize',draw);
  rebuild();
})();
</script>
