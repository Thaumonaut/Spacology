<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Battlefield</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
:root{
  --bg:#0F161C; --panel:#151E26; --raised:#1D2831; --line:#26313B;
  --ink:#E8EDF2; --ink2:#9FB0BF; --ink3:#5F6E7B;
  --gold:#D4A45C; --good:#7FBE86; --bad:#C4626F; --stone:#28323C;
}
html,body{margin:0;background:var(--bg);color:var(--ink);overscroll-behavior:none;
  font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:16px 14px 70px}
h1{font-size:19px;font-weight:600;margin:0 0 2px}
.sub{color:var(--ink2);margin:0 0 16px;max-width:60ch}
.cols{display:grid;grid-template-columns:64px minmax(0,1fr) 250px;gap:14px;align-items:start}
@media (max-width:880px){.cols{grid-template-columns:56px minmax(0,1fr)}
  .side{grid-column:1/-1}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px}
.card + .card{margin-top:11px}
.hd{font-size:11px;color:var(--ink3);margin:0 0 8px;letter-spacing:.02em}

/* ---------- phase banner ---------- */
#phase{display:flex;align-items:center;justify-content:space-between;
  background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:9px 13px;margin-bottom:11px}
#phase .l{font-size:13px;font-weight:600}
#phase .r{font-size:11px;color:var(--ink3)}
#phase.fighting{border-color:#4A3A22;background:#1B1811}
#phase.fighting .l{color:var(--gold)}

/* ---------- fields ---------- */
.fl{font-size:10px;color:var(--ink3);margin:0 0 5px;transition:opacity .5s}
#eboard,#board{display:grid;gap:6px;touch-action:none;position:relative;
  transition:gap .6s cubic-bezier(.3,.8,.3,1)}
#arena{position:relative}
#shots{position:absolute;inset:0;pointer-events:none;z-index:40;overflow:visible}
.gap{margin:7px 0;height:22px;display:flex;align-items:center;justify-content:center;
  font-size:9px;color:var(--ink3);transition:height .6s cubic-bezier(.3,.8,.3,1);
  background:repeating-linear-gradient(90deg,transparent 0 8px,rgba(95,110,123,.16) 8px 9px)}
body.fighting .gap{height:12px}
body.fighting .fl{opacity:.35}
body.fighting .ground{opacity:.28}

.cell{position:relative;aspect-ratio:1;border-radius:8px;cursor:pointer;
  background:var(--stone);border:1px solid #313D48;padding-bottom:11px;
  display:flex;align-items:center;justify-content:center;
  transition:transform .1s,box-shadow .14s,filter .14s}
.cell .surf{position:absolute;inset:0;border-radius:7px;pointer-events:none}
.t-ridge{border-color:#4E5D6B}
.t-ridge .surf{background:linear-gradient(#4A5866 0 34%,#333F4A 34% 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.14),inset 0 -6px 8px rgba(0,0,0,.4)}
.t-thicket .surf{background:#232D2A;
  background-image:radial-gradient(circle at 30% 30%,rgba(160,200,170,.30) 1.4px,transparent 1.5px),
    radial-gradient(circle at 72% 62%,rgba(160,200,170,.24) 1.6px,transparent 1.7px),
    radial-gradient(circle at 48% 84%,rgba(160,200,170,.20) 1.2px,transparent 1.3px);
  background-size:11px 11px,13px 13px,9px 9px}
.t-flats{border-color:#5A5544}
.t-flats .surf{background:#3B3A31;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
.t-marsh .surf{background:#222E36;background-image:repeating-linear-gradient(0deg,
  transparent 0 5px,rgba(140,180,205,.20) 5px 6px)}
.t-rubble .surf{background:#2C2A33;
  background-image:linear-gradient(35deg,rgba(180,170,200,.16) 25%,transparent 26%),
    linear-gradient(-42deg,rgba(180,170,200,.13) 30%,transparent 31%);
  background-size:9px 9px,12px 12px}
.cell .ground{position:absolute;left:0;right:0;bottom:0;height:12px;z-index:2;
  border-radius:0 0 7px 7px;display:flex;align-items:center;justify-content:center;
  font-size:7px;letter-spacing:.05em;color:rgba(232,237,242,.7);
  background:rgba(9,13,17,.5);text-transform:uppercase;pointer-events:none;
  transition:opacity .5s}
.cell.bare .ground{background:none;color:rgba(159,176,191,.4)}
.cell.dimmed{filter:brightness(.45) saturate(.4)}
.cell.taken{filter:brightness(.5)}
.cell.drop{box-shadow:0 0 0 2px var(--good);transform:scale(1.04)}
.cell.pulse{box-shadow:0 0 0 2px rgba(196,98,111,.8)}
.cell.hot{box-shadow:0 0 0 2px var(--gold)}
.cell.acting{box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(212,164,92,.45);
  transform:scale(1.05);z-index:5}
.cell.struck{animation:shake .3s}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,2px)}
  60%{transform:translate(3px,-2px)}}
.cell.blastzone{box-shadow:inset 0 0 0 2px rgba(196,98,111,.55)}

.chip{position:relative;z-index:3;width:74%;border-radius:6px;
  background:rgba(28,38,47,.84);border:1px solid #4A5865;padding:3px 2px;
  text-align:center;line-height:1.15;box-shadow:0 2px 7px rgba(0,0,0,.5)}
.chip .nm{font-size:10px;font-weight:600}
.chip .rl{font-size:7.5px;color:var(--ink3)}
.chip.foechip{background:rgba(43,32,40,.86);border-color:#5E3A44}
.chip.foechip .nm{color:#E0A9B1}
.chip.foechip.elite{border-color:#8E4E5C}
.chip .hpb{height:3px;border-radius:2px;background:#0E1419;margin-top:3px;
  position:relative;overflow:hidden;display:none}
body.fighting .chip .hpb{display:block}
.chip .hpb u{position:absolute;inset:0;display:block;text-decoration:none;
  background:var(--ink);transition:width .3s}
.chip .hpb i{position:absolute;inset:0;display:block;background:var(--bad);
  transition:width .5s .3s}
.chip.dead{opacity:.22;filter:grayscale(1)}
.chip .sh{position:absolute;left:-3px;right:-3px;top:-3px;bottom:-3px;
  border-radius:8px;border:1.5px solid rgba(127,190,134,.6);display:none}
body.fighting .chip.shielded .sh{display:block}
#ghost{position:fixed;z-index:90;pointer-events:none;width:62px;
  transform:translate(-50%,-50%) scale(1.1);display:none}

.float{position:absolute;z-index:60;pointer-events:none;font-weight:700;
  font-variant-numeric:tabular-nums;text-shadow:0 2px 6px rgba(0,0,0,.9)}

/* ---------- turn column ---------- */
#track{display:flex;flex-direction:column;gap:4px}
.tk{border:1px solid var(--line);border-radius:7px;background:var(--raised);
  padding:4px 2px;text-align:center}
.tk .tn{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk .tw{font-size:7.5px;color:var(--ink3)}
.tk.now{border-color:var(--gold);background:#2C2517}
.tk.now .tn{color:var(--gold)} .tk.now .tw{color:var(--gold)}
.tk.foe .tn{color:#D89AA3}
.tk.brk{border-color:#6E3B44;opacity:.6}
.tk.fade{opacity:.4}

/* ---------- controls ---------- */
.seg{display:flex;flex-wrap:wrap;gap:5px}
.seg button{flex:1 1 auto;min-width:46px;background:var(--raised);color:var(--ink2);
  border:1px solid var(--line);border-radius:8px;padding:6px;font-size:12px;
  font-family:inherit;cursor:pointer}
.seg button.on{background:#2A3541;color:var(--ink);border-color:#46545F}
label.rw{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);
  margin:10px 0 4px}
label.rw b{color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--gold)}
button.go{width:100%;background:var(--gold);color:#20180B;border:0;border-radius:9px;
  padding:11px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;
  margin-top:9px}
button.go.alt{background:var(--raised);color:var(--ink);border:1px solid var(--line)}
button.go:disabled{opacity:.45}
.note{font-size:11px;color:var(--ink3);line-height:1.6;margin-top:8px}
#log{height:150px;overflow:auto;font-size:11.5px;line-height:1.75;
  background:#101820;border:1px solid var(--line);border-radius:9px;padding:9px}
#log b{color:var(--ink)}
#log .rnd{color:var(--gold);margin-top:5px}
#log .brk{color:#E08A98}
#log .miss{color:var(--ink3)}
#insp{position:fixed;z-index:80;width:218px;background:#18222B;border:1px solid #33414D;
  border-radius:11px;padding:11px 12px;display:none;box-shadow:0 12px 34px rgba(0,0,0,.6)}
#insp h4{margin:0 0 2px;font-size:13px}
#insp .who{font-size:10.5px;color:var(--ink3);line-height:1.45;margin-bottom:7px}
#insp .row{display:flex;justify-content:space-between;font-size:11.5px;padding:2px 0}
#insp .row span:last-child{color:var(--ink2);font-variant-numeric:tabular-nums}
#insp .g{color:var(--good)} #insp .b{color:var(--bad)}
#insp .x{position:absolute;right:8px;top:5px;font-size:15px;color:var(--ink3);cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
<h1>Battlefield</h1>
<p class="sub">The enemies take their ground first. You place against them, then the
same board plays the fight &mdash; shots cross the field, and the ridges you avoided
are the ones that stop them.</p>

<div id="phase"><span class="l" id="phL">Placement</span><span class="r" id="phR"></span></div>

<div class="cols">
  <div><div class="card" style="padding:9px 7px"><div id="track"></div></div></div>
  <div>
    <div class="card">
      <p class="fl">Their ground</p>
      <div id="arena">
        <div id="eboard"></div>
        <div class="gap" id="gapLbl">open ground</div>
        <p class="fl">Your ground</p>
        <div id="board"></div>
        <svg id="shots"></svg>
      </div>
      <div class="note" id="hint"></div>
    </div>
  </div>
  <div class="side">
    <div class="card" id="cPlace">
      <p class="hd">Before the fight</p>
      <button class="go" id="begin">Begin the fight</button>
      <button class="go alt" id="suggest">Suggest a layout</button>
      <button class="go alt" id="roll">New ground</button>
      <label class="rw">Crew <b id="vTeam">6</b></label>
      <input type="range" id="rTeam" min="3" max="9" step="1" value="6">
      <label class="rw">Enemies <b id="vFoes">8</b></label>
      <input type="range" id="rFoes" min="3" max="12" step="1" value="8">
      <label class="rw">Field <b id="vSize">3&times;6</b></label>
      <div class="seg" id="segSize"></div>
    </div>
    <div class="card" id="cFight" style="display:none">
      <p class="hd">Fight</p>
      <button class="go" id="play">Play</button>
      <button class="go alt" id="stepB">Step</button>
      <button class="go alt" id="back">Back to placement</button>
      <label class="rw">Pace <b id="vPace">100%</b></label>
      <input type="range" id="rPace" min="40" max="220" step="10" value="100">
    </div>
    <div class="card">
      <p class="hd">Log</p>
      <div id="log"></div>
    </div>
  </div>
</div>
</div>
<div id="ghost"></div>
<div id="insp"><div class="x">&times;</div><h4 id="iT"></h4>
  <div class="who" id="iW"></div><div id="iB"></div></div>
<script>
/* ============================ model ============================ */
// Every tile helps someone and hurts someone else. None is simply better.
var TILE={
  plain :{lbl:'Open',   draw:1.00, dmg:1.00, out:1.00, taken:1.00,
          who:'nobody in particular'},
  ridge :{lbl:'Ridge',  draw:1.55, dmg:1.15, out:1.00, taken:1.00, blocks:1, high:1,
          who:'gunners who can take a hit \u2014 sees over everything, seen by everything'},
  thicket:{lbl:'Thicket',draw:0.55, dmg:1.00, out:0.35, taken:1.00, hides:1,
          who:'menders and blockers \u2014 cannot be shot, cannot shoot out'},
  flats :{lbl:'Salt flats',draw:1.25, dmg:1.35, out:1.00, taken:1.35,
          who:'bait and glass cannons \u2014 everything hits harder, both ways'},
  marsh :{lbl:'Marsh',  draw:1.00, dmg:1.00, out:1.00, taken:0.70, slow:0.74,
          who:'slow heavies \u2014 dug in, tough, and late'},
  rubble:{lbl:'Rubble', draw:1.00, dmg:1.00, out:1.00, taken:1.00, noblast:1,
          who:'anyone bunching up \u2014 blasts do not spread through it'}
};
var TKEYS=Object.keys(TILE);
var KITS=[
  {tag:'shields', n:'Ward',   d:'covers two squares around it', sp:80, dmg:13,hpMul:1.6,
   reach:2, block:.62, falloff:.30},
  {tag:'bait',    n:'Tarn',   d:'draws fire and hits back',     sp:84, dmg:11,hpMul:1.3,
   thorns:2.6, taunt:5},
  {tag:'gun',     n:'Corr',   d:'straight shot, big number',    sp:96, dmg:28},
  {tag:'gun',     n:'Bosk',   d:'straight shot',                sp:100,dmg:26},
  {tag:'arcs',    n:'Rime',   d:'arcs over anything',           sp:104,dmg:23, lob:1},
  {tag:'mends',   n:'Fen',    d:'heals two squares around it',  sp:108,dmg:11,heal:44, area:2},
  {tag:'gun',     n:'Wick',   d:'straight shot, quick',         sp:112,dmg:22},
  {tag:'shields', n:'Ballast',d:'covers one square around it',  sp:76, dmg:17,hpMul:1.5,
   reach:1, block:.55, falloff:.30},
  {tag:'arcs',    n:'Mote',   d:'arcs, weaker',                 sp:106,dmg:19, lob:1}
];
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var SHPER=14,SOAK=.55,VULN=.35;
function cheb(a,b){return Math.max(Math.abs(a.row-b.row),Math.abs(a.col-b.col));}
// The two fields face each other. Their board occupies rows 0..R-1 of a shared
// space, then a strip of open ground, then yours. A sight line crosses both.
var GAP=1;
function worldRow(side,r,rows){ return side==='foe' ? r : rows+GAP+r; }
function worldMap(emap,pmap,rows,cols){
  var w=[];
  for(var r=0;r<rows;r++) w.push(emap[r].slice());
  for(var g=0;g<GAP;g++){ var blank=[]; for(var c=0;c<cols;c++) blank.push('plain'); w.push(blank); }
  for(var r2=0;r2<rows;r2++) w.push(pmap[r2].slice());
  return w;
}
function blockedLine(map,from,to){
  var steps=Math.max(Math.abs(from.row-to.row),Math.abs(from.col-to.col));
  if(steps<2) return false;
  for(var i=1;i<steps;i++){
    var r=Math.round(from.row+(to.row-from.row)*i/steps);
    var c=Math.round(from.col+(to.col-from.col)*i/steps);
    var t=map[r]&&map[r][c];
    if(t&&TILE[t].blocks) return true;
  }
  return false;
}
// Enemies are kits too, and they pick their ground the same way the crew does.
var FOEKITS=[
  {n:'Lance', tag:'straight', d:'a long clean shot, and it wants to see you',
   sp:96, dmg:11, hp:56, shl:1, kind:'straight', wants:'sight'},
  {n:'Bastion',tag:'shields', d:'stands over the others and soaks for them',
   sp:78, dmg:9,  hp:160,shl:2, kind:'straight', wants:'near', elite:1},
  {n:'Mortar',tag:'arcs',    d:'lobs over everything, so it hides',
   sp:88, dmg:12, hp:60, shl:1, kind:'lob', wants:'cover'},
  {n:'Howler',tag:'blast',   d:'a wide blast, aimed where you bunch up',
   sp:84, dmg:10, hp:70, shl:1, kind:'blast', wants:'sight'},
  {n:'Brute', tag:'heavy',   d:'slow and enormous, hits like a wall',
   sp:74, dmg:19, hp:180,shl:2, kind:'straight', wants:'forward', elite:1},
  {n:'Stalker',tag:'quick',  d:'fast, and it goes for whoever is softest',
   sp:118,dmg:8,  hp:48, shl:1, kind:'straight', wants:'cover'}
];
function foeRoster(n){
  var out=[];
  for(var i=0;i<n;i++) out.push(FOEKITS[i%FOEKITS.length]);
  return out;
}
// score a square on THEIR field for one of their kits
function foeSquare(kit,r,c,emap,pmap,rows,cols,taken){
  var t=TILE[emap[r][c]];
  var w=worldMap(emap,pmap,rows,cols);
  var reach=0,total=0;
  for(var pr=0;pr<rows;pr++) for(var pc=0;pc<cols;pc++){
    total++;
    var from={row:worldRow('foe',r,rows),col:c};
    var to={row:worldRow('ally',pr,rows),col:pc};
    if(kit.kind==='lob'||(!blockedLine(w,from,to)&&t.out>=1)) reach++;
  }
  var cover=1-reach/Math.max(1,total);
  var near=0;
  taken.forEach(function(q){
    if(Math.max(Math.abs(q[0]-r),Math.abs(q[1]-c))<=1) near++; });
  var v=0;
  if(kit.wants==='sight')   v = (reach/total)*1.2 + (t.high?.5:0) + (t.dmg-1)*.7
                                - (t.out<1?1.1:0) - (t.slow?.4:0);
  if(kit.wants==='cover')   v = cover*1.0 + (t.hides?.7:0) + (1-t.taken)*.6
                                - (t.slow?.3:0);
  if(kit.wants==='near')    v = Math.min(1,near/2)*1.0 + (1-t.taken)*.7
                                + (t.hides?.2:0);
  if(kit.wants==='forward') v = (rows-1-r)/Math.max(1,rows-1)*0.9 + (t.dmg-1)*.8
                                + (1-t.taken)*.4 - (t.slow?.5:0);
  return v;
}
// greedy: the ones with the strongest opinions choose first
function placeFoes(rows,cols,emap,pmap,n){
  var roster=foeRoster(n), taken=[], out=[];
  var order=roster.map(function(k,i){return i}).sort(function(a,b){
    var w={sight:0,forward:1,cover:2,near:3};
    return w[roster[a].wants]-w[roster[b].wants];
  });
  var slots=new Array(n);
  order.forEach(function(i){
    var kit=roster[i],best=null,bv=-1e9;
    for(var r=0;r<rows;r++) for(var c=0;c<cols;c++){
      if(taken.some(function(q){return q[0]===r&&q[1]===c})) continue;
      var v=foeSquare(kit,r,c,emap,pmap,rows,cols,taken);
      if(v>bv){bv=v;best=[r,c];}
    }
    if(!best){ for(var r2=0;r2<rows&&!best;r2++) for(var c2=0;c2<cols&&!best;c2++)
      if(!taken.some(function(q){return q[0]===r2&&q[1]===c2})) best=[r2,c2]; }
    if(best){ taken.push(best); slots[i]=best; }
  });
  for(var i2=0;i2<n;i2++) out.push(slots[i2]||[0,0]);
  return out;
}
var _fpCache={key:null,val:null};
function foePosts(rows,cols,n,emap,pmap){
  emap=emap||(typeof S!=='undefined'?S.emap:null);
  pmap=pmap||(typeof S!=='undefined'?S.map:null);
  if(!emap||!pmap){ // fall back to a simple line if called before the maps exist
    var out=[],band=Math.min(3,cols);
    for(var i=0;i<n;i++) out.push([Math.floor(i/band)%rows,cols-1-(i%band)]);
    return out;
  }
  var key=rows+'|'+cols+'|'+n+'|'+JSON.stringify(emap)+JSON.stringify(pmap);
  if(_fpCache.key===key) return _fpCache.val;
  var v=placeFoes(rows,cols,emap,pmap,n);
  _fpCache={key:key,val:v};
  return v;
}
function fight(cfg,seed){
  var rnd=mb(seed), rows=cfg.rows, cols=cfg.cols;
  var pmap=cfg.map, emap=cfg.emap||cfg.map;
  var map=worldMap(emap,pmap,rows,cols);
  var posts=foePosts(rows,cols,cfg.foes,emap,pmap);
  var U=[];
  cfg.team.forEach(function(c,i){
    var p=cfg.placement[i]; if(!p) return;
    var t=TILE[pmap[p[0]][p[1]]];
    U.push(Object.assign({},c,{id:'a'+i,side:'ally',
      row:worldRow('ally',p[0],rows),col:p[1],home:p[0],
      draw:t.draw,tdmg:t.taken,outMul:t.out,hides:t.hides||0,
      noblast:t.noblast||0,high:t.high||0,dealMul:t.dmg,
      hp:Math.round(112*(c.hpMul||1)),max:Math.round(112*(c.hpMul||1)),
      av:(10000/c.sp)/(t.slow||1),alive:true}));
  });
  if(!U.length) return {over:'wipe',round:0};
  var fr=foeRoster(cfg.foes);
  for(var i=0;i<cfg.foes;i++){
    var kit=fr[i], pp=posts[i], et=TILE[emap[pp[0]][pp[1]]];
    U.push({id:'f'+i,side:'foe',name:kit.n,row:worldRow('foe',pp[0],rows),col:pp[1],
      home:pp[0],high:et.high||0,hides:et.hides||0,
      sp:Math.round(kit.sp*(et.slow||1)),
      dmg:Math.round(kit.dmg*cfg.diff*et.dmg*(et.high?1.15:1)),
      hp:Math.round(kit.hp*cfg.diff),max:Math.round(kit.hp*cfg.diff),
      shL:kit.shl,shC:SHPER,broken:false,vuln:0,alive:true,
      draw:1,tdmg:et.taken,outMul:et.out,
      av:(10000/kit.sp)*(0.4+rnd()*0.6), kind:kit.kind});
  }
  var alive=function(){return U.filter(function(u){return u.alive})};
  var foes=function(){return U.filter(function(u){return u.side==='foe'&&u.alive})};

function bAlive(){ return B.u.filter(function(u){return u.alive}); }
function bFoes(){ return B.u.filter(function(u){return u.side==='foe'&&u.alive}); }
function bAllies(){ return B.u.filter(function(u){return u.side==='ally'&&u.alive}); }

function bCover(t){

    if(!a.reach||a===t) return;
    var d=Math.max(Math.abs(a.cell[0]-t.cell[0]),Math.abs(a.cell[1]-t.cell[1]));
    if(d>a.reach) return;

function bHit(src,tgt,amt,straight){

    if(cv.who.hp<=0){cv.who.alive=false; ev.blockerDown=cv.who.id;} }

  if(!bAllies().length){ B.over='Crew wiped'; return {end:B.over}; }

  var act=al[0], ad=act.av;

  if(nr>B.round){ B.round=nr; ev.newRound=nr;
    B.u.forEach(function(u){ if(u.side==='foe'&&u.vuln>0)u.vuln--; });
    if(B.round>B.cap){ B.over='Out of rounds'; return {end:B.over}; } }

          if(nowH&&!didH) mark='<span class="delta good">now in range</span>';
          if(!nowH&&didH) mark='<span class="delta bad">out of range</span>';
        } else if(S.sel>=0){
          ex=lit[pi]?' hot':(back[pi]?' pulse':' dimmed');
        }
        inner+=mark;
      }
    } else if(S.phase==='place'&&(S.sel>=0||hov)) ex=' dimmed';
    eh+=cellHTML('foe',r,c,ex,inner);
  }
  eb.innerHTML=eh;
  var html='';
  for(var r2=0;r2<S.rows;r2++) for(var c2=0;c2<S.cols;c2++){
    var o2=unitAt('ally',r2,c2), ex2='', inner2=o2?chipHTML(o2):'';
    if(S.phase==='place'&&d){
      if(occupant(r2,c2)>=0&&occupant(r2,c2)!==d.i) ex2=' taken';
      if(d.over&&d.over[0]===r2&&d.over[1]===c2) ex2+=' drop';
    }
    html+=cellHTML('ally',r2,c2,ex2,inner2);
  }
  b.innerHTML=html;
  document.querySelectorAll('.cell').forEach(function(el){
    el.addEventListener('pointerdown',onDown); });
  sizeShots();
  if(S.phase==='place') placeChrome(d,hov); else track();
}
function placeChrome(d,hov){
  if(d&&hov){
    var kn=crew()[d.i].n;
    var lost=hov.before.seen.filter(function(x){return hov.seen.indexOf(x)<0}).length;
    var bits=[kn+' seen by '+hov.seen.length+' of '+S.foes];
    if(lost) bits.push(lost+' lose sight');
    bits.push('can hit '+hov.shoot.length);
    if(hov.tile.hides) bits.push('cannot shoot out');
    if(hov.tile.high) bits.push('high ground');
    $('gapLbl').textContent=bits.join(' \u00b7 ');
  } else if(S.sel>=0&&S.place[S.sel]){
    var k=crew()[S.sel],p=S.place[S.sel],t=TILE[S.map[p[0]][p[1]]];
    var s=sightFrom(p[0],p[1],k.lob,t.hides);
    $('gapLbl').textContent=k.n+' reaches '+s.shoot.length+' of '+S.foes+
      ', '+s.seen.length+' reach back';
  } else $('gapLbl').textContent='open ground';
  $('hint').textContent=d?'Watch their field: dimmed enemies cannot see this square.'
    :'Drag someone across the ground and watch who loses sight of them.';
}
function sizeShots(){
  var a=$('arena'), sv=$('shots');
  sv.setAttribute('width',a.clientWidth); sv.setAttribute('height',a.clientHeight);
  sv.setAttribute('viewBox','0 0 '+a.clientWidth+' '+a.clientHeight);
}
function centreOf(u){
  var side=u.side==='foe'?'foe':'ally';
  var el=document.querySelector('.cell[data-side="'+side+'"][data-r="'+u.cell[0]+
    '"][data-c="'+u.cell[1]+'"]');
  if(!el) return null;
  var a=$('arena').getBoundingClientRect(), b=el.getBoundingClientRect();
  return {x:b.left-a.left+b.width/2, y:b.top-a.top+b.height/2-5, el:el};
}
/* ============================ placement input ============================ */
function cellFromPoint(x,y){
  var el=document.elementFromPoint(x,y);
  while(el&&!el.classList.contains('cell')) el=el.parentElement;
  return el;
}
function onDown(e){
  var el=e.currentTarget, side=el.dataset.side, r=+el.dataset.r, c=+el.dataset.c;
  if(S.phase!=='place'){ inspect(el,side,r,c); return; }
  if(side==='foe'){ inspect(el,'foe',r,c); return; }
  var oi=occupant(r,c);
  if(oi<0){ S.sel=-1; inspect(el,'ally',r,c); draw(); return; }
  e.preventDefault(); hideInsp(); S.sel=oi;
  S.drag={i:oi,from:[r,c],over:[r,c]};
  var g=$('ghost'), k=crew()[oi];
  g.innerHTML='<div class="chip" style="border-color:var(--gold)"><div class="nm">'+
    k.n+'</div><div class="rl">'+k.tag+'</div></div>';
  g.style.display='block'; g.style.left=e.clientX+'px'; g.style.top=e.clientY+'px';
  window.addEventListener('pointermove',onMove);
  window.addEventListener('pointerup',onUp);
  draw();
}
function onMove(e){
  if(!S.drag) return; e.preventDefault();
  var g=$('ghost'); g.style.left=e.clientX+'px'; g.style.top=e.clientY+'px';
  var el=cellFromPoint(e.clientX,e.clientY);
  if(el&&el.dataset.side==='ally'){
    var r=+el.dataset.r,c=+el.dataset.c;
    if(!S.drag.over||S.drag.over[0]!==r||S.drag.over[1]!==c){
      S.drag.over=[r,c]; draw(); }
  }
}
function onUp(e){
  if(!S.drag) return;
  window.removeEventListener('pointermove',onMove);
  window.removeEventListener('pointerup',onUp);
  $('ghost').style.display='none';
  var d=S.drag, el=cellFromPoint(e.clientX,e.clientY); S.drag=null;
  if(el&&el.dataset.side==='ally'){
    var r=+el.dataset.r,c=+el.dataset.c,oi=occupant(r,c);
    if(oi<0) S.place[d.i]=[r,c];
    else if(oi!==d.i){ var t=S.place[oi]; S.place[oi]=S.place[d.i]; S.place[d.i]=t; }
  }
  draw();
}
function inspect(el,side,r,c){
  var t=TILE[(side==='foe'?S.emap:S.map)[r][c]], rows='';
  function row(k,v,cls){ rows+='<div class="row"><span>'+k+'</span><span class="'+
    (cls||'')+'">'+v+'</span></div>'; }
  if(t.high) row('High ground','+15% damage, sees over','g');
  if(t.hides) row('Cannot be shot into','or out of','g');
  if(t.taken>1) row('Damage taken','+'+Math.round((t.taken-1)*100)+'%','b');
  if(t.taken<1) row('Damage taken','\u2212'+Math.round((1-t.taken)*100)+'%','g');
  if(t.dmg>1) row('Damage dealt','+'+Math.round((t.dmg-1)*100)+'%','g');
  if(t.slow) row('Acts','\u2212'+Math.round((1-t.slow)*100)+'% as often','b');
  if(t.noblast) row('Blasts','do not spread here','g');
  if(!rows) row('Plain ground','nothing either way');
  var o=unitAt(side,r,c);
  if(o){
    var nm,dd;
    if(S.phase==='place'){ nm=o.k.n; dd=o.k.d; }
    else { nm=(o.u.name||o.u.n); dd=o.u.hp+' of '+o.u.max+' left'; }
    rows+='<div class="row" style="margin-top:6px;border-top:1px solid #2A3742;'+
      'padding-top:6px"><span><b>'+nm+'</b></span><span>'+dd+'</span></div>';
    if(S.phase==='place'&&side==='ally'){
      var s=sightFrom(r,c,o.k.lob,t.hides);
      row('Can reach',s.shoot.length+' of '+S.foes,s.shoot.length>S.foes*.6?'g':'b');
      row('Exposed to',s.seen.length+' of '+S.foes,s.seen.length<S.foes*.5?'g':'b');
    }
  }
  $('iT').textContent=t.lbl; $('iW').textContent=t.who; $('iB').innerHTML=rows;
  var box=el.getBoundingClientRect(), ins=$('insp');
  ins.style.display='block';
  ins.style.left=Math.min(window.innerWidth-230,Math.max(8,box.left-100))+'px';
  var y=box.bottom+8;
  if(y+ins.offsetHeight>window.innerHeight-8) y=Math.max(8,box.top-ins.offsetHeight-8);
  ins.style.top=y+'px';
}
function hideInsp(){ $('insp').style.display='none'; }
$('insp').querySelector('.x').onclick=hideInsp;

/* ============================ battle presentation ============================ */
function say(t,cls){
  var l=$('log');
  l.innerHTML+='<div'+(cls?' class="'+cls+'"':'')+'>'+t+'</div>';
  l.scrollTop=l.scrollHeight;
}
function track(){
  var q=bProject(9), el=$('track'), h='';
  q.forEach(function(s,i){
    var u=s.u;
    h+='<div class="tk'+(i===0?' now':'')+(u.side==='foe'?' foe':'')+
      (u.broken?' brk':'')+(i>6?' fade':'')+'"><div class="tn">'+
      (u.name||u.n)+'</div><div class="tw">'+(i===0?'now':s.wait)+'</div></div>';
  });
  el.innerHTML=h;
}
function paint(u){
  var ch=$('ch-'+u.id); if(!ch) return;
  var p=Math.max(0,u.hp/u.max*100);
  ch.querySelector('u').style.width=p+'%';
  clearTimeout(ch._t);
  ch._t=setTimeout(function(){ ch.querySelector('i').style.width=p+'%'; },D(420));
  ch.classList.toggle('dead',!u.alive);
  ch.classList.toggle('shielded',u.side==='foe'&&!u.broken&&u.shL>0);
}
function floatTxt(u,txt,col,size,delay){
  var pos=centreOf(u); if(!pos) return;
  setTimeout(function(){
    var d=document.createElement('div');
    d.className='float'; d.textContent=txt;
    d.style.cssText+='left:'+pos.x+'px;top:'+pos.y+'px;color:'+col+
      ';font-size:'+(size||17)+'px;transform:translate(-50%,-50%);opacity:1;'+
      'transition:transform '+D(700)+'ms cubic-bezier(.2,.7,.3,1),opacity '+D(700)+'ms';
    $('arena').appendChild(d);
    requestAnimationFrame(function(){
      d.style.transform='translate(-50%,-50%) translateY(-26px)'; d.style.opacity='0'; });
    setTimeout(function(){d.remove()},D(760));
  },delay||0);
}
function shot(from,to,col,ms,dashed){
  var a=centreOf(from), b=centreOf(to); if(!a||!b) return;
  var sv=$('shots');
  var ln=document.createElementNS('http://www.w3.org/2000/svg','line');
  ln.setAttribute('x1',a.x); ln.setAttribute('y1',a.y);
  ln.setAttribute('x2',a.x); ln.setAttribute('y2',a.y);
  ln.setAttribute('stroke',col); ln.setAttribute('stroke-width',dashed?1.5:2.5);
  ln.setAttribute('stroke-linecap','round');
  if(dashed) ln.setAttribute('stroke-dasharray','3 4');
  ln.style.transition='all '+ms+'ms cubic-bezier(.4,0,.5,1)';
  sv.appendChild(ln);
  requestAnimationFrame(function(){
    ln.setAttribute('x2',b.x); ln.setAttribute('y2',b.y); });
  setTimeout(function(){ ln.style.opacity='0';
    setTimeout(function(){ln.remove()},260); },ms+120);
}
function strike(u){
  var p=centreOf(u); if(p&&p.el){ p.el.classList.add('struck');
    setTimeout(function(){p.el.classList.remove('struck')},320); }
}
function playEvent(ev,done){
  if(ev.end){ say('<b>'+ev.end+'</b>','rnd'); S.playing=false;
    $('play').textContent='Play'; $('phR').textContent=ev.end;
    if(done)done(); return; }
  if(ev.newRound) say('Round '+ev.newRound,'rnd');
  var act=ev.actor, ac=centreOf(act);
  if(ac&&ac.el) ac.el.classList.add('acting');
  var t=D(150);
  if(ev.recover){
    say('&nbsp;'+(act.name||act.n)+' reforms', 'brk');
    floatTxt(act,'reform','#7FBE86',13,0);
    paint(act);
  }
  if(ev.stuck) say('&nbsp;'+(act.n)+' has no shot from the thicket','miss');
  if(ev.blast){
    var bl=document.querySelector('.cell[data-side="ally"][data-r="'+ev.blast[0]+
      '"][data-c="'+ev.blast[1]+'"]');
    for(var dr=-1;dr<=1;dr++) for(var dc=-1;dc<=1;dc++){
      var q=document.querySelector('.cell[data-side="ally"][data-r="'+(ev.blast[0]+dr)+
        '"][data-c="'+(ev.blast[1]+dc)+'"]');
      if(q){ q.classList.add('blastzone');
        (function(x){setTimeout(function(){x.classList.remove('blastzone')},D(620))})(q); }
    }
  }
  ev.shreds.forEach(function(sh){
    var u=B.u.filter(function(x){return x.id===sh.id})[0];
    setTimeout(function(){
      floatTxt(u,sh.broke?'break':'shield \u2212'+(sh.from-sh.to),
        sh.broke?'#E08A98':'#9FB0BF',sh.broke?16:12,0);
      if(sh.broke) say('&nbsp;<b>BREAK</b> \u2014 '+(u.name||u.n),'brk');
      paint(u);
    },t);
  });
  ev.hits.forEach(function(h,i){
    var src=B.u.filter(function(x){return x.id===h.src})[0];
    var tgt=B.u.filter(function(x){return x.id===h.tgt})[0];
    var delay=t+i*D(90);
    var col=src.side==='ally'?'#D4A45C':'#C4626F';
    setTimeout(function(){
      shot(src,tgt,h.walled?'#5F6E7B':col,D(190),!!h.walled||!!h.hidden);
    },delay);
    setTimeout(function(){
      if(h.walled){ floatTxt(tgt,'blocked','#9FB0BF',12,0);
        say('&nbsp;'+(src.name||src.n)+' \u2192 '+(tgt.name||tgt.n)+
          ' <span style="color:#5F6E7B">stopped by the ridge</span>','miss'); return; }
      if(h.hidden){ floatTxt(tgt,'no sight','#9FB0BF',12,0);
        say('&nbsp;'+(src.name||src.n)+' cannot see into the thicket','miss'); return; }
      strike(tgt);
      floatTxt(tgt,h.dmg,tgt.side==='ally'?'#E8A0A8':'#FFFFFF',18,0);
      if(h.blocked){
        var bw=B.u.filter(function(x){return x.id===h.blocked.id})[0];
        floatTxt(bw,'\u2212'+h.blocked.amt,'#7FA8C9',13,90); paint(bw);
        say('&nbsp;'+(bw.n)+' takes '+h.blocked.amt+' of it','miss');
      }
      if(h.thorns){ floatTxt(src,'\u2212'+h.thorns,'#7FBE86',15,140); paint(src); }
      paint(tgt);
      say('&nbsp;'+(src.name||src.n)+' \u2192 '+(tgt.name||tgt.n)+' <b>'+h.dmg+'</b>'+
        (h.killed?' <span style="color:#E08A98">down</span>':''));
    },delay+D(200));
  });
  if(ev.mends) ev.mends.forEach(function(m,i){
    var u=B.u.filter(function(x){return x.id===m.id})[0];
    setTimeout(function(){ floatTxt(u,'+'+m.amt,'#7FBE86',16,0); paint(u); },t+i*D(80));
    if(i===0) say('&nbsp;'+(act.n)+' mends '+ev.mends.length+' of the crew');
  });
  ev.notes.forEach(function(n){ say('&nbsp;'+n,'miss'); });
  var total=t+Math.max(1,ev.hits.length)*D(90)+D(420);
  setTimeout(function(){
    if(ac&&ac.el) ac.el.classList.remove('acting');
    track();
    B.u.forEach(function(u){ if(!u.alive){ var ch=$('ch-'+u.id);
      if(ch) ch.classList.add('dead'); } });
    if(done) done();
  },total);
}
/* ============================ phase transition ============================ */
function toBattle(){
  hideInsp(); S.sel=-1; S.drag=null;
  if(S.place.filter(Boolean).length<2){
    $('hint').textContent='Place at least two of the crew first.'; return; }
  initBattle({rows:S.rows,cols:S.cols,map:S.map,emap:S.emap,team:crew(),
    placement:S.place,foes:S.foes,diff:1.0,cap:18});
  S.phase='fight';
  document.body.classList.add('fighting');
  $('phase').classList.add('fighting');
  $('phL').textContent='Fighting';
  $('phR').textContent='round 1';
  $('cPlace').style.display='none'; $('cFight').style.display='';
  $('log').innerHTML=''; say('Round 1','rnd');
  // the fields close in, then the fight starts
  draw();
  var eb=$('eboard'), b=$('board');
  [eb,b].forEach(function(g){ g.style.gap='4px'; });
  $('gapLbl').textContent='';
  setTimeout(function(){ $('hint').textContent=
    'Shots cross the field. A dashed grey line is one the ground stopped.'; },400);
}
function toPlacement(){
  S.playing=false; B=null; S.phase='place';
  document.body.classList.remove('fighting');
  $('phase').classList.remove('fighting');
  $('phL').textContent='Placement'; $('phR').textContent='';
  $('cPlace').style.display=''; $('cFight').style.display='none';
  $('eboard').style.gap='6px'; $('board').style.gap='6px';
  $('track').innerHTML='';
  draw();
}
function stepOnce(after){
  if(!B||B.over){ if(after)after(); return; }
  var ev=bStep();
  $('phR').textContent='round '+B.round;
  playEvent(ev,after);
}
function loop(){
  if(!S.playing) return;
  stepOnce(function(){ if(S.playing) setTimeout(loop,D(120)); });
}

/* ============================ controls ============================ */
function buildSizes(){
  $('segSize').innerHTML=SIZES.map(function(s){
    return '<button data-r="'+s[0]+'" data-c="'+s[1]+'"'+
      ((s[0]===S.rows&&s[1]===S.cols)?' class="on"':'')+'>'+s[0]+'\u00d7'+s[1]+'</button>';
  }).join('');
  $('vSize').textContent=S.rows+'\u00d7'+S.cols;
  $('segSize').querySelectorAll('button').forEach(function(bt){
    bt.onclick=function(){
      S.rows=+bt.dataset.r; S.cols=+bt.dataset.c;
      if(S.team>S.rows*S.cols){ S.team=S.rows*S.cols;
        $('rTeam').value=S.team; $('vTeam').textContent=S.team; }
      rollMap(); autoPlace(); S.sel=-1; buildSizes(); draw();
    };
  });
}
$('rTeam').oninput=function(){
  S.team=Math.min(+this.value,S.rows*S.cols); this.value=S.team;
  $('vTeam').textContent=S.team; autoPlace(); S.sel=-1; draw();
};
$('rFoes').oninput=function(){
  S.foes=+this.value; $('vFoes').textContent=this.value; _fpCache.key=null; draw();
};
$('rPace').oninput=function(){
  S.pace=100/(+this.value); $('vPace').textContent=this.value+'%';
};
$('roll').onclick=function(){ rollMap(); hideInsp(); draw(); };
$('begin').onclick=toBattle;
$('back').onclick=toPlacement;
$('stepB').onclick=function(){ S.playing=false; $('play').textContent='Play'; stepOnce(); };
$('play').onclick=function(){
  S.playing=!S.playing; this.textContent=S.playing?'Pause':'Play';
  if(S.playing) loop();
};
$('suggest').onclick=function(){
  var b=this; b.disabled=true;
  var order=crew().map(function(k,i){return i}).sort(function(x,y){
    var w=function(k){ return k.reach?0:(k.area?1:(k.thorns?2:3)); };
    return w(crew()[x])-w(crew()[y]);
  });
  var step=0;
  (function next(){
    if(step>=order.length){ b.disabled=false; S.sel=-1; draw(); return; }
    var i=order[step++], best=null, bv=-1e9;
    for(var r=0;r<S.rows;r++) for(var c=0;c<S.cols;c++){
      var oc=occupant(r,c); if(oc>=0&&oc!==i) continue;
      var v=squareValue(i,r,c); if(v>bv){bv=v;best=[r,c];}
    }
    if(best){ S.place[i]=best; S.sel=i; draw(); }
    setTimeout(next,320);
  })();
};
document.addEventListener('pointerdown',function(e){
  if(!$('insp').contains(e.target)&&!e.target.closest('.cell')) hideInsp();
});
window.addEventListener('resize',sizeShots);
buildSizes(); rollMap(); autoPlace(); draw();
</script></body></html>
