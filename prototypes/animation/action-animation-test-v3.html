<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Action animation test v3</title>
<style>
:root{
  --bg:#131A21; --panel:#1B242D; --raised:#232F3A; --line:#2E3C48;
  --ink:#DCE4EA; --ink2:#8A98A5; --ink3:#5F6E7B;
  --ghost:#C97F9E; --energy:#D4A45C; --growth:#8FB878;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
body{padding:14px 14px calc(20px + env(safe-area-inset-bottom))}
h1{font-size:15px;font-weight:500;margin:0 0 2px}
.sub{font-size:12px;color:var(--ink3);margin:0 0 14px}
.zlabel{font-size:10px;color:var(--ink3);letter-spacing:.06em;margin-bottom:6px}
.field{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}

#stage{height:230px;background:#0F161C;border:1px solid var(--line);border-radius:10px;
  position:relative;overflow:hidden;perspective:700px}
.slot{position:absolute;top:52px;width:104px;height:80px;border-radius:10px;
  background:var(--raised);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500}
#actor{left:20px;color:var(--energy);border-color:var(--energy);background:#2A3541}
#target{right:20px}
#glow{position:absolute;left:20px;top:52px;width:104px;height:80px;border-radius:10px;pointer-events:none}
.arrow{position:absolute;top:84px;left:50%;transform:translateX(-50%);
  font-size:20px;color:var(--energy);opacity:0}

.bar{position:absolute;top:140px;width:104px;height:7px;border-radius:4px;
  background:#26313B;overflow:hidden}
#barT{right:20px}
#barA{left:20px}
.bar .gh{position:absolute;inset:0;background:var(--ghost);width:100%}
.bar .fx{position:absolute;inset:0;background:var(--ink);width:100%}
#hpnum{position:absolute;top:152px;right:20px;width:104px;text-align:center;
  font-size:11px;color:var(--ink3)}
#pips{position:absolute;top:172px;right:20px;width:104px;text-align:center;
  font-size:13px;letter-spacing:3px;color:var(--growth)}

.dn{position:absolute;font-weight:500;color:var(--ink);pointer-events:none;opacity:0}
#combo{position:absolute;top:16px;right:20px;font-size:13px;color:var(--energy);opacity:0}
.cap{position:absolute;bottom:9px;left:0;right:0;text-align:center;font-size:12px;color:var(--ink2)}
.phasetag{position:absolute;top:10px;left:12px;font-size:10px;color:var(--ink3);letter-spacing:.06em}
#stage.wash{background:#4A3C22}

#timeline{display:flex;height:24px;border:1px solid var(--line);border-radius:6px;
  overflow:hidden;margin-top:10px}
#timeline div{display:flex;align-items:center;justify-content:center;
  font-size:9px;color:#0F161C;overflow:hidden;white-space:nowrap}

.ctl{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;background:transparent;border:0;border-right:1px solid var(--line);
  color:var(--ink2);padding:10px 3px;font-size:12px;font-family:inherit;min-height:40px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--raised);color:var(--ink)}
.sigline{font-size:11px;color:var(--ink3);margin-top:6px}
label{display:block;font-size:11px;color:var(--ink3);margin:11px 0 3px;overflow:hidden}
label b{float:right;color:var(--ink);font-weight:400;font-size:12px}
label.hold{color:var(--ink2)}
label.gh{color:var(--ghost)}
input[type=range]{width:100%;accent-color:var(--energy);height:26px}
.tog{display:flex;align-items:center;justify-content:space-between;
  padding:9px 0;border-top:1px solid var(--line);font-size:12px;color:var(--ink2);margin-top:8px}
.tog input{width:44px;height:26px;accent-color:var(--energy)}
.btns{display:flex;gap:8px;margin-top:12px}
.btns button{flex:1;background:var(--raised);border:1px solid var(--line);color:var(--ink);
  border-radius:8px;padding:11px;font-size:13px;font-family:inherit;min-height:44px}
.btns button:active{background:#2C3A46}
.readout{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);
  border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.readout b{color:var(--ink);font-weight:500}
</style>
</head>
<body>

<h1>Action animation test v3</h1>
<p class="sub">Trailing health, multi-hit, pitch ladder.</p>

<div class="field">
  <div id="stage">
    <div class="phasetag" id="ptag">idle</div>
    <div class="slot" id="actor">Hammer</div>
    <div id="glow"></div>
    <div class="arrow" id="arrow">&#10230;</div>
    <div class="slot" id="target">Husk</div>
    <div class="bar" id="barA"><div class="gh" id="ghA"></div><div class="fx" id="fxA"></div></div>
    <div class="bar" id="barT"><div class="gh" id="ghT"></div><div class="fx" id="fxT"></div></div>
    <div id="hpnum">100 / 100</div>
    <div id="pips">&#9670;&#9670;&#9670;</div>
    <div id="combo"></div>
    <div class="cap" id="cap">Rivet strike</div>
  </div>
  <div id="timeline"></div>
</div>

<div class="ctl">
  <div class="zlabel">Tier</div>
  <div class="seg" id="segTier">
    <button data-v="basic" class="on">Basic</button>
    <button data-v="skill">Skill</button>
    <button data-v="ult">Ultimate</button>
  </div>
  <div class="sigline" id="sig">Charge signature: pull back</div>

  <label>Hits <b id="vHits"></b></label>
  <input type="range" id="rHits" min="1" max="8" step="1" value="1">

  <label>Gap between hits <b id="vGap"></b></label>
  <input type="range" id="rGap" min="40" max="500" step="20" value="120">

  <label class="gh">Ghost bar delay <b id="vGdelay"></b></label>
  <input type="range" id="rGdelay" min="0" max="1200" step="40" value="420">

  <label class="gh">Ghost bar drain <b id="vGdrain"></b></label>
  <input type="range" id="rGdrain" min="80" max="1600" step="40" value="620">

  <label>Enter <b id="vEnter"></b></label>
  <input type="range" id="rEnter" min="0" max="400" step="20" value="80">

  <label class="hold">Settle &mdash; read who <b id="vSettle"></b></label>
  <input type="range" id="rSettle" min="0" max="1200" step="20" value="240">

  <label>Charge <b id="vCharge"></b></label>
  <input type="range" id="rCharge" min="40" max="2000" step="20" value="200">

  <label>Release <b id="vRelease"></b></label>
  <input type="range" id="rRelease" min="20" max="300" step="10" value="70">

  <label>Hitstop <b id="vStop"></b></label>
  <input type="range" id="rStop" min="0" max="300" step="10" value="70">

  <label class="hold">Aftermath &mdash; read the total <b id="vAfter"></b></label>
  <input type="range" id="rAfter" min="0" max="2000" step="20" value="520">

  <label>Exit <b id="vExit"></b></label>
  <input type="range" id="rExit" min="0" max="400" step="20" value="90">

  <label>Impact intensity <b id="vPunch"></b></label>
  <input type="range" id="rPunch" min="10" max="100" step="5" value="30">

  <div class="tog"><span>Overlap exit with next entrance</span><input type="checkbox" id="cOverlap" checked></div>
  <div class="tog"><span>Rising pitch ladder</span><input type="checkbox" id="cAudio"></div>

  <div class="btns">
    <button id="bLoop">Loop</button>
    <button id="bOnce">Once</button>
  </div>

  <div class="readout">
    <span>Action <b id="oTotal">&mdash;</b></span>
    <span>17-action fight <b id="oFight">&mdash;</b></span>
  </div>
</div>

<script>
var KEYS=['enter','settle','charge','release','stop','after','exit'];
var LBL={enter:'enter',settle:'settle',charge:'charge',release:'hits',stop:'',after:'aftermath',exit:'exit'};
var TLC={enter:'#3E4C58',settle:'#8A98A5',charge:'#D4A45C',release:'#FFFFFF',
         stop:'#C97F9E',after:'#7FA8C9',exit:'#2E3C48'};

var PRESET={
  basic:{enter:80, settle:240,charge:200, release:70,stop:70, after:520, exit:90, punch:30,
         hits:1,gap:120,sig:'pullback',name:'Rivet strike',per:14},
  skill:{enter:120,settle:300,charge:640, release:70,stop:110,after:700, exit:120,punch:55,
         hits:3,gap:150,sig:'compress',name:'Overload',per:13},
  ult:  {enter:200,settle:420,charge:1440,release:70,stop:180,after:1100,exit:200,punch:100,
         hits:6,gap:170,sig:'tilt',    name:'Unmaking',per:16}
};
var SIGNAME={pullback:'pull back',compress:'compress',tilt:'tilt'};

var tier='basic', looping=false, running=false, chain=[], actx=null;
var hp=100, ghostTimer=null;

function $(i){return document.getElementById(i)}
function C(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function g(k){return +$('r'+C(k)).value}

function hitBlock(){ var n=g('hits'); return n*(g('release')+g('stop'))+(n-1)*g('gap'); }
function total(){
  var t=g('enter')+g('settle')+g('charge')+hitBlock()+g('after')+g('exit');
  if($('cOverlap').checked) t-=Math.min(g('exit'),g('enter'));
  return t;
}
function sync(){
  ['enter','settle','charge','release','stop','after','exit','gap','gdelay','gdrain']
    .forEach(function(k){ $('v'+C(k)).textContent=g(k)+'ms'; });
  $('vHits').textContent=g('hits');
  $('vPunch').textContent=g('punch')+'%';
  $('oTotal').textContent=total()+'ms';
  $('oFight').textContent=(total()*17/1000).toFixed(1)+'s';
  var tl=$('timeline'); tl.innerHTML='';
  var t=total()||1;
  var seg={enter:g('enter'),settle:g('settle'),charge:g('charge'),
           release:hitBlock(),after:g('after'),exit:g('exit')};
  ['enter','settle','charge','release','after','exit'].forEach(function(k){
    var w=seg[k]/t*100; if(w<=0) return;
    var d=document.createElement('div');
    d.style.width=w+'%'; d.style.background=k==='release'?'#C97F9E':TLC[k];
    d.textContent = w>14 ? (k==='release'?g('hits')+' hits':LBL[k]) : '';
    tl.appendChild(d);
  });
}
function loadPreset(){
  var p=PRESET[tier];
  KEYS.forEach(function(k){ $('r'+C(k)).value=p[k]; });
  $('rPunch').value=p.punch; $('rHits').value=p.hits; $('rGap').value=p.gap;
  $('cap').textContent=p.name;
  $('sig').textContent='Charge signature: '+SIGNAME[p.sig];
  sync();
}

function beep(i,n){
  if(!$('cAudio').checked) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    var o=actx.createOscillator(), gn=actx.createGain();
    o.type='triangle';
    o.frequency.value=300*Math.pow(1.12,i) * (i===n-1?1.25:1);
    gn.gain.setValueAtTime(.09,actx.currentTime);
    gn.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.14);
    o.connect(gn); gn.connect(actx.destination);
    o.start(); o.stop(actx.currentTime+.15);
  }catch(e){}
}

function setBars(){
  $('fxT').style.transition='none'; $('fxT').style.width=hp+'%';
  $('ghT').style.transition='none'; $('ghT').style.width=hp+'%';
  $('hpnum').textContent=Math.round(hp)+' / 100';
}
function applyHit(dmg){
  hp=Math.max(0,hp-dmg);
  $('fxT').style.transition='width 90ms cubic-bezier(.2,.9,.3,1)';
  $('fxT').style.width=hp+'%';
  $('hpnum').textContent=Math.round(hp)+' / 100';
  clearTimeout(ghostTimer);
  ghostTimer=setTimeout(function(){
    $('ghT').style.transition='width '+g('gdrain')+'ms cubic-bezier(.3,.6,.3,1)';
    $('ghT').style.width=hp+'%';
  },g('gdelay'));
}
function popNumber(dmg,i,P){
  var d=document.createElement('div');
  d.className='dn';
  d.textContent=dmg;
  d.style.fontSize=(15+16*P)+'px';
  d.style.top=(30+ (i%3)*16 )+'px';
  d.style.right=(30+ (i%4)*10 )+'px';
  $('stage').appendChild(d);
  requestAnimationFrame(function(){
    d.style.transition='opacity 120ms ease, transform 620ms cubic-bezier(.15,.9,.3,1)';
    d.style.opacity='1'; d.style.transform='translateY(-22px)';
    setTimeout(function(){ d.style.opacity='0';
      setTimeout(function(){ d.remove(); },260); },420);
  });
}

function at(ms,fn){ chain.push(setTimeout(fn,ms)); }
function clearChain(){ chain.forEach(clearTimeout); chain=[]; clearTimeout(ghostTimer); }
function chargePose(){
  var s=PRESET[tier].sig;
  if(s==='pullback') return 'translateX(-30px)';
  if(s==='compress') return 'scale(.84)';
  return 'rotateY(38deg) translateX(-14px) scale(1.04)';
}
function setT(el,ms,tf){
  el.style.transition='transform '+ms+'ms '+(tf||'ease')+
    ',opacity '+ms+'ms ease,box-shadow '+ms+'ms ease';
}

function run(){
  if(running) return; running=true;
  var a=$('actor'),t=$('target'),ar=$('arrow'),gl=$('glow'),
      pv=$('pips'),stg=$('stage'),tg=$('ptag'),cb=$('combo');
  var E=g('enter'),SE=g('settle'),CH=g('charge'),RE=g('release'),
      ST=g('stop'),GP=g('gap'),AF=g('after'),EX=g('exit'),
      P=g('punch')/100, N=g('hits'), per=PRESET[tier].per;

  hp=100; setBars();
  document.querySelectorAll('.dn').forEach(function(e){e.remove()});
  a.style.transition='none'; a.style.transform='translateX(-150px)'; a.style.opacity='0';
  t.style.transition='none'; t.style.transform='none';
  gl.style.transition='none'; gl.style.boxShadow='none';
  ar.style.opacity='0'; cb.style.opacity='0'; stg.classList.remove('wash');
  pv.textContent='\u25C6\u25C6\u25C6'; pv.style.color='var(--growth)';

  var T=20;
  at(T,function(){ tg.textContent='enter';
    setT(a,E,'cubic-bezier(.2,.9,.3,1)'); a.style.transform='none'; a.style.opacity='1'; });
  T+=E;
  at(T,function(){ tg.textContent='settle'; });
  T+=SE;
  at(T,function(){ tg.textContent='charge';
    setT(a,CH,'cubic-bezier(.35,0,.65,1)'); a.style.transform=chargePose();
    setT(gl,CH); gl.style.boxShadow='0 0 '+(10+34*P)+'px '+(2+8*P)+'px rgba(212,164,92,'+(.25+.5*P)+')';
    setT(ar,CH); ar.style.opacity='.45'; });
  T+=CH;

  for(var i=0;i<N;i++){
    (function(k){
      var base=T + k*(RE+ST+GP);
      at(base,function(){
        tg.textContent = N>1 ? ('hit '+(k+1)+' of '+N) : 'release';
        setT(a,RE,'cubic-bezier(.7,0,.9,.15)');
        a.style.transform='translateX('+(46+ (k%2?4:0) )+'px) scale(1.05)';
        ar.style.opacity='1';
      });
      at(base+RE,function(){
        a.style.transition='none';
        gl.style.transition='none'; gl.style.boxShadow='none';
        var last = (k===N-1);
        var scale = last && N>1 ? 1.6 : 1;
        if(P>.7||last&&N>3) stg.classList.add('wash');
        t.style.transition='none';
        t.style.transform='translateX('+((4+8*P)*scale)+'px)';
        setTimeout(function(){ t.style.transform='translateX('+(-3-5*P)+'px)'; },Math.min(40,ST/2));
        applyHit(Math.round(per*scale));
        popNumber(Math.round(per*scale),k,P);
        beep(k,N);
        if(N>1){ cb.style.opacity='1'; cb.textContent='\u00D7'+(k+1); }
        setTimeout(function(){ stg.classList.remove('wash'); },Math.max(60,ST));
      });
      at(base+RE+ST,function(){
        if(k<N-1){
          setT(a,GP*0.8,'cubic-bezier(.2,.8,.4,1)');
          a.style.transform='translateX(-6px) scale(.97)';
          setT(t,GP*0.8); t.style.transform='none';
        }
      });
    })(i);
  }

  T+=hitBlock();
  at(T,function(){ tg.textContent='aftermath';
    pv.textContent='\u25C6\u25C6\u25C7'; pv.style.color='var(--ink)';
    setT(t,140+320*P,'cubic-bezier(.15,.9,.3,1)');
    t.style.transform='translateX('+(10+34*P)+'px)';
    setT(a,AF*0.4,'cubic-bezier(.2,.8,.4,1)'); a.style.transform='none';
    setT(ar,AF*0.35); ar.style.opacity='0';
    setTimeout(function(){ pv.style.color='var(--growth)'; },Math.min(260,AF*0.5));
    setTimeout(function(){ setT(t,AF*0.4); t.style.transform='none'; },AF*0.45);
    setTimeout(function(){ cb.style.transition='opacity 200ms'; cb.style.opacity='0'; },AF*0.7);
  });
  T+=AF;
  at(T,function(){ tg.textContent='exit';
    setT(a,EX,'cubic-bezier(.6,0,.9,.2)');
    a.style.transform='translateX(150px)'; a.style.opacity='0'; });

  at(total()+60,function(){
    running=false; tg.textContent='idle';
    if(looping){ clearChain(); run(); }
  });
}

$('segTier').onclick=function(e){
  var b=e.target.closest('button'); if(!b) return;
  this.querySelectorAll('button').forEach(function(x){x.classList.remove('on')});
  b.classList.add('on'); tier=b.dataset.v; loadPreset();
};
['enter','settle','charge','release','stop','after','exit','punch','hits','gap','gdelay','gdrain']
  .forEach(function(k){ $('r'+C(k)).oninput=sync; });
$('cOverlap').onchange=sync;
$('bLoop').onclick=function(){ looping=!looping; this.textContent=looping?'Stop':'Loop';
  if(looping&&!running){ clearChain(); run(); } };
$('bOnce').onclick=function(){ looping=false; $('bLoop').textContent='Loop';
  clearChain(); running=false; run(); };

$('fxA').style.width='72%'; $('ghA').style.width='72%';
loadPreset(); setBars();
</script>
</body>
</html>
