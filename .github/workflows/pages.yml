name: Validate and deploy Spacology playtest library

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, station-games-checkpoint]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            game/package-lock.json
            runner-next/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix game ci
          npm --prefix runner-next ci
          npx playwright install --with-deps chromium
      - name: Check root unit rules
        run: npm run test:unit
      - name: Check station games and preserved demo
        run: npm run test:browser:release
      - name: Check expedition types and runner rules
        run: |
          npm --prefix game run check
          npm --prefix game test
          npm --prefix runner-next test
      - name: Build Pages artifact
        run: npm run build:pages
      - name: Check published paths and offline demo
        run: npm run test:pages
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
