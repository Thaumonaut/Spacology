name: Deploy Spacology playtest library

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            game/package-lock.json
            runner-next/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix game ci
          npm --prefix runner-next ci
          npx playwright install --with-deps chromium
      - name: Check expedition types and runner rules
        run: |
          npm --prefix game run check
          npm --prefix game test
          npm --prefix runner-next test
      - name: Build Pages artifact
        run: npm run build:pages
      - name: Check published paths and offline demo
        run: npm run test:pages
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
